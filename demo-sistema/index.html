<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demonstração: gestão de conteúdo para agências | Creative Codex</title>
<meta name="description" content="Demonstração com dados fictícios de um sistema de gestão de cronogramas, posts e pedidos de arte para agências de marketing.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f26a0e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf5;--side:#fafafa;--card:#fff;--line:#eadfd4;--tx:#2a2420;--dim:#7a6c60;--ac:#f26a0e;--ac2:#fff1e6;--ok:#1f9d63;--okb:#e5f6ed;--warn:#d98a0b;--warnb:#fdf0d9;--bad:#dc3f3f;--badb:#fde8e8;--info:#2f6fe4;--infob:#e6eefc}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.brand b{font-family:"Poppins",system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
select,input,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem}
.demo{background:var(--ac);color:#fff;text-align:center;font-weight:600;font-size:.8rem;padding:.45rem 1rem}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.app>div{min-width:0}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 16px}.brand i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#f26a0e,#ff9a3c);display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff}
.brand b{display:block;line-height:1.1}.brand span{font-size:.74rem;color:var(--dim)}
.g{margin-bottom:4px}.g>button{display:flex;width:100%;align-items:center;gap:9px;background:none;border:0;border-radius:10px;padding:.55rem .7rem;color:var(--tx);cursor:pointer;text-align:left;font-weight:600;font-size:.92rem}
.g>button:hover{background:#f1ebe5}.g>button.on{background:var(--ac2);color:var(--ac)}
.g .sb{display:none;padding:2px 0 6px 22px}.g.open .sb{display:block}
.sb button{display:block;width:100%;text-align:left;background:none;border:0;padding:.35rem .7rem;border-radius:8px;color:var(--dim);cursor:pointer;font-size:.86rem}.sb button.on{color:var(--ac);font-weight:600}.sb button:hover{background:#f1ebe5}
.ic{width:18px;text-align:center;font-size:.95rem}
main{padding:26px clamp(16px,3vw,40px) 70px;max-width:1280px;width:100%}
h1{font-size:1.55rem;line-height:1.2}.sub{color:var(--dim);margin:2px 0 18px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.5rem .9rem;cursor:pointer;font-weight:600}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn:hover{filter:brightness(.97)}.btn{text-decoration:none;color:var(--tx);display:inline-block}.btn.pri{color:#fff}.btn.sm{padding:.3rem .6rem;font-size:.82rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 4px 24px -12px rgba(242,106,14,.25)}.k b{font-size:1.8rem;display:block;line-height:1.15;font-family:Poppins,sans-serif}.k span{color:var(--dim);font-size:.82rem}
.k.bad b{color:var(--bad)}.k.ok b{color:var(--ok)}.k.ac b{color:var(--ac)}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-bottom:16px}.grid2.w{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}.grid2.h{grid-template-columns:1fr 1fr}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.card+.card{margin-top:14px}.grid2 .card+.card,.grid3 .card+.card{margin-top:0}
.card h2{font-size:.76rem;color:var(--dim);margin-bottom:12px;letter-spacing:.05em;font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{color:var(--dim);font-size:.74rem}.cal .d{position:relative;aspect-ratio:1.15;display:grid;place-items:center;border-radius:8px;font-size:.85rem}
.cal .d.has{background:var(--ac2)}.cal .d.has::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--ac)}
.cal .d.today{outline:2px solid var(--ac)}
.row{display:flex;align-items:center;gap:10px;padding:.55rem 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t span{font-size:.8rem;color:var(--dim)}
.chip{display:inline-block;border-radius:99px;padding:.12rem .6rem;font-size:.73rem;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okb);color:var(--ok)}.c-warn{background:var(--warnb);color:var(--warn)}.c-bad{background:var(--badb);color:var(--bad)}.c-info{background:var(--infob);color:var(--info)}.c-mut{background:#f0e9e2;color:var(--dim)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:.4rem .9rem;color:var(--dim);cursor:pointer;font-weight:600}.tabs button[aria-selected=true]{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:.74rem;color:var(--dim);padding:.5rem .6rem;font-weight:600}td{padding:.65rem .6rem;border-top:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.empty{text-align:center;color:var(--dim);padding:30px 8px}
dialog{background:#fff;color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(460px,92vw)}dialog::backdrop{background:rgba(42,36,32,.45)}
.f{display:grid;gap:10px;margin:14px 0}.f label{display:grid;gap:4px;font-size:.82rem;color:var(--dim)}
.bar{height:8px;background:#f0e9e2;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:8px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem;flex:0 0 34px}
.cc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.cc .card{display:flex;gap:12px;align-items:center;padding:14px}
.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:330px;margin:0 auto;background:#fff}.feed i{aspect-ratio:4/5;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.7rem;text-align:center;padding:4px;color:#fff;line-height:1.1}
.phone{border:8px solid #2a2420;border-radius:28px;padding:10px;background:#fff;max-width:360px;margin:0 auto}
.slots{display:grid;grid-template-columns:40px repeat(5,minmax(0,1fr));gap:3px;font-size:.74rem}.slots div{padding:.35rem .1rem;min-width:0;overflow:hidden;border-radius:6px;text-align:center}.slots .l{color:var(--dim)}.slots .fr{background:var(--okb);color:var(--ok)}.slots .oc{background:var(--badb);color:var(--bad)}
.mnav{display:none}
@media (max-width:900px){
 .app{grid-template-columns:1fr}.side{display:none}
 .mnav{display:flex;position:sticky;top:0;z-index:40;background:var(--side);border-bottom:1px solid var(--line);overflow-x:auto;gap:6px;padding:8px 12px}
 .mnav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:.4rem .8rem;color:var(--dim);font-weight:600;cursor:pointer}.mnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
 .kpis{grid-template-columns:1fr 1fr}.grid2,.grid2.w,.grid2.h,.grid3{grid-template-columns:1fr}
}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media print{.demo,.side,.mnav,.btn{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="demo">Demonstração com dados fictícios. Nenhuma informação real de agência ou cliente.</div>
<div class="app">
 <aside class="side"><div class="brand"><i>AD</i><div><b>Agência Demo</b><span>Gestão de conteúdo</span></div></div><nav id="nav"></nav></aside>
 <div><nav class="mnav" id="mnav"></nav><main id="main"></main></div>
</div>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=864e5,T0=new Date();T0.setHours(12,0,0,0);
const dt=n=>new Date(T0.getTime()+n*day),iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const D=s=>new Date(s+'T12:00'),br=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const COL=['#f26a0e','#2f6fe4','#1f9d63','#a64ca6','#d98a0b','#dc3f3f','#0f8b8d','#6b5b95'];
const team=[['Ana Souza','Gestora','#f26a0e'],['Bruno Lima','Designer','#2f6fe4'],['Carla Dias','Tráfego','#1f9d63'],['Diego Rocha','Vídeo','#a64ca6']];
const names=['Casa do Pão','Pizzaria Napoli','Burger Lab','Sushi Kaze','Academia Pulse','Café Aroma','Churrasco do Zé','Doceria Mel','Bistrô Verde','Tapioca da Vila','Lanchonete Central','Studio Fit','Padaria Sol','Sorveteria Gelato'];
const OFFS=[[1,0,1,2,3,4,5,6],[0,2,4,6,8,10,12],[1,3,6,9],[0,1,3,5,7,9,11,13,15,17],[2,4,9,12,16],[],[-3,-1],[1,2,5],[],[-2,0,1],[4,7,10,14,18,21],[],[-1],[3,6,9,12,15,18,21,24]];
const clients=names.map((n,i)=>({id:i,name:n,color:COL[i%8],ig:'@'+n.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'')+'.demo',resp:team[i%2][0],tel:'(11) 9'+String(1000+i*37).padStart(4,'0')+'-'+String(2000+i*53).padStart(4,'0'),mrr:[900,1200,800,1500,700,900,600,800,1000,700,900,600,700,1100][i]}));
const FMT=['Reels','Feed','Stories','Carrossel'],TIT=['Prato do dia','Promoção da semana','Bastidores','Aniversariante','Novidade no cardápio','Depoimento de cliente','Combo família','Dica do chef','Instrumental','Lançamento'];
const STP=['Rascunho','Esperando aprovação','Aprovado','Programado','Publicado'];
let posts=[],n=0;
clients.forEach(c=>OFFS[c.id].forEach((o,j)=>{n++;posts.push({id:n,c:c.id,d:iso(dt(o)),f:FMT[(n+j)%4],t:TIT[(n*3+j)%TIT.length],s:o<0?4:o===0?(n%2?4:1):[1,2,3][n%3]})}));
const RS=['Aguardando','Em produção','Alteração solicitada','Entregue','Aprovada','Recusada'],AB=RS.slice(0,3);
let reqs=[['Casa do Pão','Arte nova','Recorrente',1,0],['Pizzaria Napoli','Atualização','Feriado',0,1],['Burger Lab','Arte nova','Outro',2,2],['Sushi Kaze','Atualização','Recorrente',-1,0],['Academia Pulse','Arte nova','Aulão',3,3],['Doceria Mel','Arte nova','Feriado',5,4],['Café Aroma','Atualização','Recorrente',0,1],['Sorveteria Gelato','Arte nova','Outro',-2,1]].map((r,i)=>({id:i+1,c:r[0],k:r[1],cat:r[2],d:iso(dt(r[3])),s:RS[r[4]],w:r[1]==='Arte nova'?3:1,r:team[1][0]}));
let traf=[['Pizzaria Napoli','Campanha de inauguração','Criar campanha',1,'Alta',0],['Sushi Kaze','Ajustar público do rodízio','Otimização',3,'Média',0],['Burger Lab','Relatório mensal','Relatório',-1,'Média',0],['Academia Pulse','Trocar criativos','Criativos',5,'Baixa',1],['Casa do Pão','Verba de novembro','Orçamento',2,'Alta',0]].map((r,i)=>({id:i+1,c:r[0],t:r[1],k:r[2],d:iso(dt(r[3])),p:r[4],done:!!r[5]}));
let vids=[['Pizzaria Napoli','Making of da pizza','Roteiro enviado',60,0],['Sushi Kaze','Chef preparando o combo','Gravando',40,1],['Burger Lab','Lançamento do burger duplo','Aprovado',100,2],['Casa do Pão','Pão saindo do forno','Ideia',0,3],['Doceria Mel','Bolo de aniversário','Gravando',70,4]].map((r,i)=>({id:i+1,c:r[0],t:r[1],s:r[2],p:r[3],d:iso(dt(r[4]*2+1))}));
const ST={g:'home',sub:'geral',cid:null,rf:'Abertas',rtab:'ped',cap:20,fin:'resumo'};
const stClass=s=>({'Publicado':'c-ok','Aprovado':'c-ok','Programado':'c-info','Esperando aprovação':'c-warn'}[s]||'c-mut');
const rsClass=s=>({'Aguardando':'c-warn','Em produção':'c-info','Alteração solicitada':'c-bad','Entregue':'c-ok','Aprovada':'c-ok'}[s]||'c-mut');
function pcl(c){const ps=posts.filter(p=>p.c===c.id&&p.d>=iso(T0)).sort((a,b)=>a.d<b.d?-1:1);const last=ps.length?ps[ps.length-1].d:(posts.filter(p=>p.c===c.id).map(p=>p.d).sort().pop()||'');
 const days=last?Math.round((D(last)-T0)/day):null;let st,cls;
 if(!last){st='Sem conteúdo';cls='c-bad'}else if(days<0){st='Vencido';cls='c-bad'}else if(days<=2){st='Acaba em breve';cls='c-warn'}else if(days<=7){st='Acabando';cls='c-warn'}else{st='Em dia';cls='c-ok'}
 return{c,fut:ps.length,last,days,st,cls}}
const GR=[['home','Início','⌂',[['geral','Visão geral'],['fila','Minha fila']]],['cron','Cronograma','▦',[['cron','Cronograma'],['novo','Nova postagem']]],['cli','Clientes','☺',[['cli','Clientes']]],['artes','Artes','✎',[['ped','Pedidos'],['rec','Recorrentes'],['sol','Solicitar arte']]],['traf','Demandas de Tráfego','↗',[['traf','Tráfego']]],['vid','Demandas de Vídeo','▶',[['vid','Vídeo']]],['calg','Calendário','◷',[['cal','Calendário'],['agenda','Agenda da equipe']]],['gest','Gestão','⚙',[['equipe','Equipe'],['carga','Carga da equipe'],['rel','Relatórios']]],['fin','Financeiro','$',[['fin','Financeiro']]]];
function nav(){const cur=ST.sub;
 $('#nav').innerHTML=GR.map(g=>{const on=g[3].some(s=>s[0]===cur)&&ST.g===g[0];return`<div class="g ${on?'open':''}"><button class="${on?'on':''}" data-g="${g[0]}" data-s="${g[3][0][0]}"><span class="ic">${g[2]}</span>${g[1]}</button><div class="sb">${g[3].length>1?g[3].map(s=>`<button class="${cur===s[0]?'on':''}" data-g="${g[0]}" data-s="${s[0]}">${s[1]}</button>`).join(''):''}</div></div>`}).join('');
 $('#mnav').innerHTML=GR.flatMap(g=>g[3].map(s=>`<button class="${ST.sub===s[0]&&ST.g===g[0]?'on':''}" data-g="${g[0]}" data-s="${s[0]}">${s[1]}</button>`)).join('')}
const hd=(t,sub,act='')=>`<div class="top"><div><h1>${t}</h1><p class="sub">${sub}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${act}</div></div>`;
const tabs=(a,cur)=>`<div class="tabs" role="tablist">${a.map(([k,l])=>`<button data-s="${k}" data-g="${ST.g}" aria-selected="${cur===k}">${l}</button>`).join('')}</div>`;
const csel=()=>`<div class="filters"><select data-cs aria-label="Cliente"><option value="">Selecione um cliente</option>${clients.map(c=>`<option value="${c.id}" ${ST.cid===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`;
const av=(c,t)=>`<span class="av" style="background:${c}">${esc(t.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span>`;
const V={};
V.geral=()=>{const all=clients.map(pcl),crit=all.filter(p=>p.days===null||p.days<=2),up=posts.filter(p=>p.d>=iso(T0)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.id-b.id),nf=up.length,ok=all.filter(p=>p.days!==null&&p.days>7).length;
 const y=T0.getFullYear(),m=T0.getMonth(),first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),has=new Set(posts.map(p=>p.d));let cal='';
 ['D','S','T','Q','Q','S','S'].forEach(l=>cal+=`<div class="h">${l}</div>`);for(let i=0;i<first;i++)cal+='<div></div>';
 for(let d=1;d<=dim;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');cal+=`<div class="d ${has.has(k)?'has':''} ${d===T0.getDate()?'today':''}">${d}</div>`}
 return hd('Visão geral','Até quando cada cliente tem conteúdo programado.','<button class="btn" onclick="window.print()">Baixar relatório (PDF)</button>')+tabs([['geral','Visão geral'],['fila','Minha fila']],'geral')+
 `<div class="kpis"><div class="k"><b>${clients.length}</b><span>Clientes ativos</span></div><div class="k"><b>${nf}</b><span>Posts programados</span></div><div class="k ok"><b>${ok}</b><span>Cronogramas em dia</span></div><div class="k bad"><b>${crit.length}</b><span>Clientes críticos</span></div></div>
 <div class="grid2"><div class="card"><h2>CALENDÁRIO DE POSTS · ${MES[m].toUpperCase()} DE ${y}</h2><div class="cal">${cal}</div></div><div class="card"><h2>PRÓXIMOS POSTS</h2>${up.slice(0,6).map(p=>`<div class="row"><div class="t"><b>${esc(p.t)}</b><span>${br(D(p.d))} · ${p.f} · ${esc(clients[p.c].name)}</span></div><span class="chip ${stClass(STP[p.s])}">${STP[p.s]}</span></div>`).join('')}</div></div>
 <div class="card"><h2>${crit.length} CLIENTES COM 2 DIAS OU MENOS DE CONTEÚDO</h2><p style="color:var(--dim);font-size:.88rem">${crit.map(p=>esc(p.c.name)+(p.days===null?' (sem posts)':p.days<0?' (vencido)':' (acaba em breve)')).join(' · ')}</p></div>
 <div class="card"><h2>CLIENTES POR PRAZO DE CONTEÚDO</h2>${all.slice().sort((a,b)=>(a.days===null?-99:a.days)-(b.days===null?-99:b.days)).map(p=>`<div class="row" data-c="${p.c.id}" style="cursor:pointer"><span class="av" style="background:${p.c.color}">${p.c.name[0]}</span><div class="t"><b>${esc(p.c.name)}</b><span>${p.last?'Conteúdo até '+br(D(p.last))+' · '+p.fut+' post(s) futuros':'Nenhum post cadastrado'}</span></div><span class="chip ${p.cls}">${p.st}</span></div>`).join('')}</div>`};
V.fila=()=>{const mine=posts.filter(p=>p.s===1).slice(0,8),r=reqs.filter(r=>AB.includes(r.s));
 return hd('Minha fila','O que precisa da sua atenção hoje.')+tabs([['geral','Visão geral'],['fila','Minha fila']],'fila')+`<div class="grid2"><div class="card"><h2>POSTS PARA APROVAR</h2>${mine.map(p=>`<div class="row"><div class="t"><b>${esc(p.t)}</b><span>${esc(clients[p.c].name)} · ${br(D(p.d))} · ${p.f}</span></div><button class="btn sm" data-ap="${p.id}">Aprovar</button></div>`).join('')||'<p class="empty">Nada pendente. Tudo em dia.</p>'}</div><div class="card"><h2>PEDIDOS DE ARTE EM ABERTO</h2>${r.map(q=>`<div class="row"><div class="t"><b>${esc(q.c)}</b><span>${q.k} · ${br(D(q.d))}</span></div><span class="chip ${rsClass(q.s)}">${q.s}</span></div>`).join('')||'<p class="empty">Nada em aberto.</p>'}</div></div>`};
V.cron=()=>{const c=clients[ST.cid];if(!c)return hd('Cronograma','Escolha um cliente para ver o cronograma.','<button class="btn pri" data-g="cron" data-s="novo">Nova postagem</button>')+csel()+'<div class="card empty"><b>Selecione um cliente</b><br>Escolha um cliente para ver o cronograma.</div>';
 const ps=posts.filter(p=>p.c===c.id).sort((a,b)=>a.d<b.d?-1:1);
 return hd(esc(c.name),ps.length+' posts no cronograma · '+esc(c.ig),`<a class="btn" href="/demo-aprovacao/" target="_blank" rel="noopener">Ver como cliente</a><button class="btn pri" data-g="cron" data-s="novo">Nova postagem</button>`)+csel()+

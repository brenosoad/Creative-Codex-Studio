<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Creative Codex</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo.png?v=2" type="image/png">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, var(--white) 0%, var(--primary-soft) 50%, var(--white) 100%);
        }
        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-title {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 3vw, 2rem);
            color: var(--dark);
            margin: 16px 0 12px;
        }
        .error-text {
            color: var(--gray);
            max-width: 420px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">Essa página saiu do ar</h1>
            <p class="error-text">O link que você seguiu pode estar quebrado ou a página foi movida. Vamos te levar de volta pro caminho certo.</p>
            <div class="error-actions">
                <a href="index.html" class="btn btn-primary">
                    <i class="fas fa-home" aria-hidden="true"></i>
                    Voltar ao início
                </a>
                <a href="index.html#contact" class="btn btn-outline">
                    <i class="fab fa-whatsapp" aria-hidden="true"></i>
                    Falar comigo
                </a>
            </div>
        </div>
    </div>
</body>
</html>

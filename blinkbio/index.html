<!DOCTYPE html>
<html lang="pt-BR" data-default="sancaporai">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carregando…</title>
<meta name="theme-color" content="#101214">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta name="twitter:card" content="summary_large_image">
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101214;
    --card: #141414;
    --line: #262626;
    --orange: #EE5A0C;
    --orange-2: #FF8A3D;
    --o-rgb: 238, 90, 12;
    --white: #ffffff;
    --muted: #a3a3a3;
    --r: 24px;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--white); min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center;
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
  }
  /* Fundo (mesmo do Mídia Kit): grafite, triângulos laranja nos cantos e brilho central */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; --sp: 0; --mx: 0; --my: 0; }
  .bg i { position: absolute; display: block; background: var(--orange); aspect-ratio: 420 / 300; width: clamp(130px, 28vw, 420px); will-change: transform; }
  .bg .c-tl {
    top: 0; left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); transform-origin: 0 0;
    transform: scale(calc(1 + var(--sp) * .35));
    animation: tri-in 1.1s var(--ease) both, tri-breathe 9s 1.1s ease-in-out infinite alternate;
  }
  .bg .c-br {
    right: 0; bottom: 0; clip-path: polygon(100% 100%, 0 100%, 100% 0); transform-origin: 100% 100%;
    transform: scale(calc(1 + var(--sp) * .35));
    animation: tri-in 1.1s .15s var(--ease) both, tri-breathe 11s 1.25s ease-in-out infinite alternate-reverse;
  }
  /* faceta mais clara dentro de cada triângulo */
  .bg .c-tl::after, .bg .c-br::after { content: ""; position: absolute; inset: 0; background: var(--orange-2); opacity: .5; }
  .bg .c-tl::after { clip-path: polygon(0 0, 58% 0, 0 58%); transform-origin: 0 0; animation: facet 7s ease-in-out infinite alternate; }
  .bg .c-br::after { clip-path: polygon(100% 100%, 42% 100%, 100% 42%); transform-origin: 100% 100%; animation: facet 8s ease-in-out infinite alternate-reverse; }
  .bg .glow {
    width: min(900px, 130vw); height: min(900px, 130vw); aspect-ratio: auto; clip-path: none;
    top: 120px; left: 50%;
    transform: translate(calc(-50% + var(--mx) * 36px), calc(var(--my) * 26px - var(--sp) * 140px));
    background: radial-gradient(circle, rgba(var(--o-rgb), .24), rgba(0,0,0,0) 68%);
    animation: glow 7s ease-in-out infinite alternate;
  }
  @keyframes tri-in { from { scale: .55; opacity: 0; } to { scale: 1; opacity: 1; } }
  @keyframes tri-breathe { from { scale: 1; } to { scale: 1.1; } }
  @keyframes facet { from { scale: .85; opacity: .3; } to { scale: 1.15; opacity: .65; } }
  @keyframes glow { from { scale: .92; opacity: .7; } to { scale: 1.12; opacity: 1; } }
  main { width: 100%; max-width: 440px; padding: 22px max(14px, env(safe-area-inset-right)) 96px max(14px, env(safe-area-inset-left)); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: 0; color: inherit; background: none; }
  :focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  svg { display: block; }

  /* Revelar ao rolar */
  .js .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
  .js .reveal.in { opacity: 1; transform: none; }
  [hidden] { display: none !important; }

  /* Topo */
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .top { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 4px 6px; }
  .logo { display: block; width: min(230px, 62vw); }
  .logo img { display: block; width: 100%; height: auto; }
  .tagline {
    font-family: "Anton", "Arial Narrow", Impact, sans-serif; font-weight: 400; text-transform: uppercase;
    font-size: clamp(25px, 7vw, 32px); line-height: 1.2; letter-spacing: .02em; margin-top: 20px; max-width: 18ch; text-wrap: balance;
  }
  .tagline em { font-style: normal; color: var(--orange); }
  .stats { display: flex; width: 100%; margin: 22px 0 8px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,.1); }
  .stat { flex: 1; text-align: center; padding: 0 6px; }
  .stat + .stat { border-left: 1px solid rgba(255,255,255,.1); }
  .stat b { display: block; font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: 28px; letter-spacing: .02em; line-height: 1.2; }
  .stat span { display: block; margin-top: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  /* Filtros */
  .filters { display: flex; justify-content: safe center; gap: 8px; overflow-x: auto; padding: 2px 2px 16px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 13px;
    border: 1px solid #3a3a3a; color: #d4d4d4; transition: .2s var(--ease);
  }
  .chip:hover { border-color: var(--orange); color: #fff; }
  .chip[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #111; }

  /* Cards */
  .card {
    position: relative; border-radius: var(--r); overflow: hidden; margin-bottom: 14px;
    background: var(--card); border: 1px solid var(--line);
    transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-3px); border-color: rgba(var(--o-rgb), .6); box-shadow: 0 14px 40px rgba(var(--o-rgb), .12); }
    .card:hover .img img { transform: scale(1.05); }
  }
  .img { position: relative; aspect-ratio: 2 / 1; overflow: hidden; background: linear-gradient(135deg, #2a2a2a, #111); }
  .img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
  .img::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,.45)); pointer-events: none; }
  .badge {
    position: absolute; top: 12px; left: 12px; z-index: 1;
    background: var(--orange); color: #111; font-weight: 800; font-size: 12.5px; letter-spacing: .02em;
    padding: 6px 12px; border-radius: 999px;
  }
  .body { padding: 16px 16px 16px; }
  .body h3 { font-size: 21px; letter-spacing: -.03em; line-height: 1.05; font-weight: 800; }
  .body p { font-size: 13.5px; color: var(--muted); margin-top: 5px; line-height: 1.4; }

  .actions { display: flex; gap: 10px; margin-top: 14px; }
  .code {
    flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border: 1.5px dashed var(--orange); border-radius: 14px; padding: 0 14px; min-height: 48px;
    font-weight: 800; letter-spacing: .04em; font-size: 14.5px; transition: .2s var(--ease);
  }
  .code .lbl { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--orange); letter-spacing: .08em; text-transform: uppercase; }
  .code:active { transform: scale(.97); }
  .code.done { background: var(--orange); color: #111; border-style: solid; }
  .code.done .lbl { color: #111; }
  .go {
    display: flex; align-items: center; gap: 6px; padding: 0 16px; min-height: 48px; border-radius: 14px;
    background: #fff; color: #111; font-weight: 800; font-size: 13.5px; white-space: nowrap; transition: .2s var(--ease);
  }
  .go:hover { background: var(--orange); }
  .go:active { transform: scale(.97); }

  /* Capa */
  .hero { background: var(--card); border: 1px solid var(--line); }
  .hero .img { aspect-ratio: 4 / 3; }
  .hero .img::after { background: none; }
  .hero .content { position: static; padding: 18px 18px 20px; }
  .kicker {
    display: inline-block; background: var(--orange); color: #111; font-size: 12px; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; margin-bottom: 10px;
  }
  .hero h2 { font-family: "Anton", Impact, sans-serif; font-weight: 400; text-transform: uppercase; font-size: 36px; line-height: 1.18; letter-spacing: .015em; max-width: 15ch; }
  .hero .cta {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 16px;
    background: #fff; color: #111; font-weight: 800; font-size: 14.5px; padding: 13px 20px; border-radius: 999px;
    transition: .2s var(--ease);
  }
  .hero:hover .cta { background: var(--orange); }
  .al-centro { text-align: center; }
  .al-direita { text-align: right; }
  .hero.al-centro h2 { margin-inline: auto; }
  .hero.al-direita h2 { margin-left: auto; }
  .al-centro .actions { justify-content: center; }
  .al-direita .actions { justify-content: flex-end; }
  .link { position: absolute; inset: 0; z-index: 2; }

  /* Growth (laranja) */
  .growth {
    background:
      repeating-linear-gradient(135deg, rgba(0,0,0,.05) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, var(--orange-2), var(--orange));
    color: #111; border: 0; padding: 22px 20px 20px;
  }
  .growth .brand { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .growth .big { font-family: "Anton", Impact, sans-serif; font-weight: 400; font-size: 110px; line-height: .9; letter-spacing: .01em; margin: 12px 0 8px; }
  .growth .big small { font-size: 40px; letter-spacing: .02em; margin-left: 6px; }
  .growth p { font-size: 14px; font-weight: 700; line-height: 1.35; max-width: 30ch; }
  .growth .actions { position: relative; z-index: 3; }
  .growth .code { border-color: #111; color: #fff; background: #111; }
  .growth .code .lbl { color: var(--orange-2); }
  .growth .code.done { background: #fff; color: #111; border-color: #111; }
  .growth .code.done .lbl { color: #111; }
  .growth .go { background: transparent; color: #111; border: 1.5px solid #111; }
  .growth .go:hover { background: #111; color: #fff; }
  .growth:hover { border-color: transparent; box-shadow: 0 14px 40px rgba(var(--o-rgb), .3); }

  /* Sorteio (branco) */
  .light { background: #fff; color: #111; border-color: #fff; }
  .light .body p { color: #555; }
  .light .go { background: #111; color: #fff; }
  .light .go:hover { background: var(--orange); color: #111; }
  .light .actions { margin-top: 14px; }
  .light .go.full { flex: 1; justify-content: center; }

  .actions .go.full { flex: 1; justify-content: center; }
  .actions .go.accent { background: var(--orange); }
  .actions .go.accent:hover { background: #fff; }

  footer { text-align: center; font-size: 12px; color: #6f6f6f; margin-top: 26px; line-height: 1.7; }
  footer strong { color: #fff; font-size: 14.5px; }
  .partner.noimg .img { display: none; }
  .cards > .partner.noimg { grid-column: 1 / -1; }
  .cards > .partner.noimg .body { padding: 22px; }
  footer .agency { display: inline-flex; align-items: center; gap: 8px; margin: 14px 0 2px; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: #fff; font-weight: 700; font-size: 13.5px; transition: .2s var(--ease); }
  footer .agency:hover { border-color: var(--orange); color: var(--orange-2); }
  footer .credit { display: inline-block; margin-top: 16px; opacity: .9; transition: opacity .2s; }
  footer .credit img { display: block; height: 52px; width: auto; }
  footer .credit:hover { opacity: 1; }

  /* Botão flutuante */
  .fab {
    position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 20;
    display: flex; align-items: center; gap: 8px;
    background: var(--orange); color: #111; font-weight: 800; font-size: 14px;
    padding: 14px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgba(var(--o-rgb), .45);
    transform: translateY(90px); opacity: 0; transition: .35s var(--ease);
  }
  .fab.show { transform: none; opacity: 1; }
  .fab:active { transform: scale(.96); }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); background: #fff; color: #111;
    font-weight: 800; font-size: 14px; padding: 12px 20px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: .3s var(--ease); z-index: 30; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Grade de cards */
  .cards { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .cards > .card { margin-bottom: 0; }
  .card.partner { display: flex; flex-direction: column; }
  .partner .body { flex: 1; display: flex; flex-direction: column; }
  .partner .body p { margin-bottom: 14px; }
  .partner .actions { margin-top: auto; }
  .growth { display: flex; flex-direction: column; }
  .growth .actions { margin-top: auto; padding-top: 18px; }

  @media (max-width: 380px) {
    .hero h2 { font-size: 29px; }
    .growth .big { font-size: 88px; }
    .tagline { font-size: 24px; }
    .stat b { font-size: 24px; }
  }

  /* Tablet e desktop */
  @media (min-width: 720px) {
    main { max-width: 960px; padding: 44px 28px 110px; }
    .top { padding: 34px 4px 8px; }
    .logo { width: 300px; }
    .tagline { font-size: 46px; max-width: 30ch; margin-top: 26px; }
    .stats { max-width: 620px; margin: 30px 0 14px; }
    .stat b { font-size: 38px; }
    .stat span { font-size: 12px; }
    .filters { padding-bottom: 22px; }
    .chip { font-size: 14px; padding: 10px 18px; }
    .cards { grid-template-columns: 1fr 1fr; gap: 18px; }
    .hero {
      grid-column: 1 / -1; display: block; aspect-ratio: 2.1 / 1; min-height: 360px;
      border: 1px solid var(--line);
    }
    .hero .img { position: absolute; inset: 0; aspect-ratio: auto; }
    .hero .img::after { background: linear-gradient(90deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.22) 42%, transparent 66%); }
    .hero .content { position: absolute; inset: 0 auto 0 0; max-width: 56%; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 40px 44px; }
    .hero h2 { font-size: clamp(40px, 5vw, 62px); max-width: 14ch; text-shadow: 0 2px 14px rgba(0,0,0,.45); }
    .hero .cta { font-size: 16px; padding: 15px 24px; }
    .hero.al-centro .content { inset: 0; max-width: none; align-items: center; }
    .hero.al-centro .img::after { background: rgba(0,0,0,.42); }
    .hero.al-direita .content { inset: 0 0 0 auto; align-items: flex-end; }
    .hero.al-direita .img::after { background: linear-gradient(270deg, rgba(0,0,0,.5) 0%, rgba(0,0,0,.22) 42%, transparent 66%); }
    .hero.al-centro h2, .hero.al-direita h2 { margin-inline: 0; }
    .hero.al-centro h2 { margin-inline: auto; }
    .growth .big { font-size: 120px; }
    .body h3 { font-size: 23px; }
    .cards > .partner.lastp { grid-column: 1 / -1; flex-direction: row; }
    .cards > .partner.lastp .img { flex: 0 0 50%; aspect-ratio: auto; min-height: 230px; }
    .cards > .partner.lastp .body { justify-content: center; padding: 24px; }
    .cards > .partner.lastp .body p { margin-bottom: 0; }
    .cards > .partner.lastp .actions { margin-top: 18px; }
    .cards > .card[data-w=cheia] { grid-column: 1 / -1; }
    .cards > .partner[data-w=cheia] { flex-direction: row; }
    .cards > .partner[data-w=cheia] .img { flex: 0 0 50%; aspect-ratio: auto; min-height: 230px; }
    .cards > .partner[data-w=cheia] .body { justify-content: center; padding: 24px; }
    .cards > .partner[data-w=cheia] .body p { margin-bottom: 0; }
    .cards > .partner[data-w=cheia] .actions { margin-top: 18px; }
  }
  @media (min-width: 1100px) {
    main { max-width: 1180px; }
    .cards { grid-template-columns: repeat(6, 1fr); }
    .cards > .card { grid-column: span 2; }
    .cards > .hero { grid-column: 1 / -1; }
    .cards > .partner.noimg:not([data-w]) { grid-column: 1 / -1; }
    .cards > .partner.lastp { grid-column: span 2; flex-direction: column; }
    .cards > .partner[data-w=meia] { flex-direction: column; }
    .cards > .partner.lastp .img { flex: none; aspect-ratio: 2 / 1; min-height: 0; }
    .cards > .partner.lastp .body { justify-content: flex-start; padding: 16px; }
    .cards > .partner.lastp .body p { margin-bottom: 14px; }
    .cards > .partner.lastp .actions { margin-top: auto; }
    .cards > article.card[data-w=terco] { grid-column: span 2; }
    .cards > article.card[data-w=meia] { grid-column: span 3; }
    .cards > article.card[data-w=cheia] { grid-column: 1 / -1; }
    .hero { min-height: 430px; }
    .growth .big { font-size: 104px; }
  }

  @media (max-width: 759px) {
    .cards.mcel { grid-template-columns: 1fr 1fr; gap: 12px; }
    .cards.mcel > .card { grid-column: span 2; }
    .cards.mcel > .card[data-w=meia] { grid-column: span 1; }
    .cards.mcel > .card[data-w=meia] h3 { font-size: 16px; }
    .cards.mcel > .card[data-w=meia] .body { padding: 12px; }
    .cards.mcel > .card[data-w=meia] .actions { flex-direction: column; }
    .cards.mcel > .growth[data-w=meia] .big { font-size: 64px; }
    .cards.mcel > .growth[data-w=meia] { padding: 14px; }
  }
  /* Modo organizar (prévia do editor) */
  .cv .card { cursor: grab; user-select: none; }
  .cv .card .link { pointer-events: none; }
  .cv .card.sel { outline: 3px solid var(--orange-2); outline-offset: 2px; }
  .cv .card.dragging { opacity: .45; }
  .cv .card.dt-before { box-shadow: -8px 0 0 var(--orange-2); }
  .cv .card.dt-after { box-shadow: 8px 0 0 var(--orange-2); }
  body.cv [data-f] { cursor: text; }
  body.cv [data-f]:hover { outline: 1px dashed rgba(255,255,255,.55); outline-offset: 3px; border-radius: 4px; }
  body.cv [data-f][contenteditable] { white-space: pre-wrap; outline: 2px solid #8B7CFF; outline-offset: 3px; border-radius: 4px; cursor: text; user-select: text; -webkit-user-select: text; }
  .cv-tx { position: fixed; z-index: 50; display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(0,0,0,.88); backdrop-filter: blur(6px); transform: translateY(-100%); margin-top: -8px; }
  .cv-tx button { background: transparent; color: #fff; border: 0; border-radius: 7px; min-width: 30px; height: 28px; padding: 0 8px; font: 700 12px system-ui, sans-serif; cursor: pointer; }
  .cv-tx button:hover { background: rgba(255,255,255,.16); }
  .cv-tx i { width: 1px; background: rgba(255,255,255,.2); margin: 3px 2px; }
  .cv-tx span { color: rgba(255,255,255,.7); font: 600 11px system-ui, sans-serif; align-self: center; padding: 0 6px; }
  .cv-bar { position: absolute; top: 8px; right: 8px; z-index: 6; display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(0,0,0,.78); backdrop-filter: blur(6px); }
  .cv-bar button { all: unset; cursor: pointer; font: 700 12px/1 system-ui, sans-serif; color: #fff; padding: 7px 9px; border-radius: 7px; min-width: 28px; text-align: center; }
  .cv-bar button:hover { background: rgba(255,255,255,.18); }
  .cv-bar button.on { background: var(--orange); color: #111; }
  .cv-bar i { width: 1px; background: rgba(255,255,255,.25); margin: 2px 2px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; animation: none !important; }
    .js .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="glow"></i><i class="c-tl"></i><i class="c-br"></i></div>
<main id="app"></main>
<div id="fab-slot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(async () => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const url = v => (/^(https?:\/\/|#)/i.test(v || '') ? v : '#');
  const ARROW = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const API = '/api/blinkbio';
  const params = new URLSearchParams(location.search);
  const EMBED = params.has('embed');           // modo prévia do editor (sem rastreio)
  const app = $('#app');
  let ac = null, io = null, bgOn = false;

  /* Config: banco (editor) primeiro; arquivo clients/<slug>/config.json como reserva */
  async function loadConfig(slug) {
    try {
      const r = await fetch(`${API}/clients?c=${slug}`, { cache: 'no-store' });
      if (r.ok) return await r.json();
    } catch {}
    const r = await fetch(`clients/${slug}/config.json`, { cache: 'no-cache' });
    if (!r.ok) throw 0;
    return r.json();
  }

  function mount(cfg, slug) {
    curCfg = cfg; curSlug = slug;
    ac?.abort(); io?.disconnect();
    ac = new AbortController();
    const sig = { signal: ac.signal };
    const keepY = scrollY;
    $$('[data-bb]', document.head).forEach(n => n.remove());

    const asset = p => /^img:/.test(p) ? `${API}/img?c=${slug}&f=${encodeURIComponent(p.slice(4))}`
      : /^(https?:)?\/\/|^(data|blob):/.test(p) || p.startsWith('/') ? p : `clients/${slug}/${p}`;

    /* Tema e metadados */
    const t = cfg.tema || {};
    const root = document.documentElement.style;
    const hex = /^#[0-9a-f]{6}$/i;
    if (hex.test(t.cor)) { root.setProperty('--orange', t.cor); root.setProperty('--o-rgb', [1, 3, 5].map(i => parseInt(t.cor.slice(i, i + 2), 16)).join(', ')); }
    if (hex.test(t.cor2)) root.setProperty('--orange-2', t.cor2);
    if (hex.test(t.fundo)) { root.setProperty('--bg', t.fundo); $('meta[name=theme-color]').content = t.fundo; }
    document.title = cfg.titulo || cfg.nome;
    const meta = (attr, key, val) => { if (!val) return; const m = document.createElement('meta'); m.setAttribute(attr, key); m.content = val; m.dataset.bb = ''; document.head.append(m); };
    meta('name', 'description', cfg.descricao);
    meta('property', 'og:title', cfg.titulo || cfg.nome);
    meta('property', 'og:description', cfg.descricao);
    if (cfg.og) meta('property', 'og:image', new URL(asset(cfg.og), location.href).href);
    const link = (rel, href, extra = {}) => { if (!href) return; const l = document.createElement('link'); l.rel = rel; l.href = href; l.dataset.bb = ''; Object.assign(l, extra); document.head.append(l); };
    link('icon', asset(cfg.favicon || ''), { type: 'image/png' });
    link('apple-touch-icon', asset(cfg.iconeApple || ''));

    /* Rastreio (painel do criador). Cada evento leva ?s=slug */
    const analytics = cfg.analytics ?? `${API}/track`;
    const ENDPOINT = !EMBED && analytics ? analytics + (analytics.includes('?') ? '&' : '?') + 's=' + slug : '';
    function track(name, data = {}) {
      if (EMBED) return;
      const evt = { event: name, ...data, site: slug, page: location.pathname, ts: Date.now() };
      (window.dataLayer = window.dataLayer || []).push(evt);
      if (ENDPOINT) { try { navigator.sendBeacon(ENDPOINT, JSON.stringify(evt)); } catch {} }
    }

    /* Render */
    const img = (c, lazy) => c.imagem
      ? `<img src="${esc(asset(c.imagem))}"${c.w ? ` width="${+c.w}" height="${+c.h}"` : ''} ${lazy ? 'loading="lazy"' : 'fetchpriority="high"'} decoding="async" alt="${esc(c.alt)}"${c.posicao ? ` style="object-position:${esc(c.posicao)}"` : ''} onerror="this.remove()">`
      : '';
    const code = c => c.cupom
      ? `<button class="code" type="button" data-code="${esc(c.cupom)}"><span>${esc(c.cupom)}</span><span class="lbl">Copiar</span></button>` : '';
    const go = (c, extra = '') => c.link
      ? `<a class="go ${extra}" href="${esc(url(c.link))}" target="_blank" rel="noopener" data-f="botao"${zk(c.id, 'botao')}>${esc(c.botao || 'Abrir')}</a>` : '';

    const MODE = matchMedia('(min-width: 760px)').matches ? 'pc' : 'cel';
    const LY = cfg.layout?.[MODE] || {}, WM = LY.larg || {};
    const nl = t => esc(t).replace(/\n/g, '<br>');
    const zk = (id, f) => { const k = +cfg.tamanhos?.[id + '.' + f]; return k && k !== 1 ? ` style="zoom:${k}"` : ''; };
    const wa = c => ((WM[c.id] || c._w) ? ` data-w="${esc(WM[c.id] || c._w)}"` : '');
    const al = c => (c.alinhar === 'centro' || c.alinhar === 'direita' ? ' al-' + c.alinhar : '');
    const card = c => {
      const id = esc(c.id), cat = c.cat ? ` data-cat="${esc(c.cat)}"` : '';
      if (c.tipo === 'capa') return `
        <article class="card hero${al(c)} reveal" id="hero" data-id="${id}">
          <div class="img">${img(c, false)}</div>
          <div class="content">
            ${c.kicker ? `<span class="kicker" data-f="kicker"${zk(c.id, 'kicker')}>${nl(c.kicker)}</span>` : ''}
            <h2 data-f="titulo"${zk(c.id, 'titulo')}>${nl(c.titulo)}</h2>
            ${c.cta ? `<span class="cta"><span data-f="cta"${zk(c.id, 'cta')}>${esc(c.cta)}</span> ${ARROW}</span>` : ''}
          </div>
          <a class="link" target="_blank" rel="noopener" aria-label="${esc(c.aria || c.cta || c.titulo)}" href="${esc(url(c.link))}"></a>
        </article>`;
      if (c.tipo === 'destaque') return `
        <article class="card growth${al(c)} reveal"${cat}${wa(c)} data-id="${id}">
          <div class="brand" data-f="marca"${zk(c.id, 'marca')}>${esc(c.marca)}</div>
          <div class="big"><span data-f="valor"${zk(c.id, 'valor')}>${esc(c.valor)}</span><small data-f="sufixo"${zk(c.id, 'sufixo')}>${esc(c.sufixo)}</small></div>
          <p data-f="texto"${zk(c.id, 'texto')}>${nl(c.texto)}</p>
          <div class="actions">${code(c)}${go(c)}</div>
        </article>`;
      return `
        <article class="card partner${c.claro ? ' light' : ''}${c.imagem ? '' : ' noimg'}${c._last ? ' lastp' : ''}${al(c)} reveal"${cat}${wa(c)} data-id="${id}">
          <div class="img">${img(c, true)}${c.selo ? `<span class="badge" data-f="selo"${zk(c.id, 'selo')}>${esc(c.selo)}</span>` : ''}</div>
          <div class="body">
            <h3 data-f="titulo"${zk(c.id, 'titulo')}>${nl(c.titulo)}</h3>
            <p data-f="texto"${zk(c.id, 'texto')}>${nl(c.texto)}</p>
            <div class="actions">${code(c)}${go(c, c.cupom ? '' : 'full' + (c.destaqueBotao ? ' accent' : ''))}</div>
          </div>
        </article>`;
    };

    const cats = cfg.categorias || {};
    const usedCats = Object.keys(cats).filter(k => (cfg.cards || []).some(c => c.cat === k));
    const fabC = cfg.botaoFlutuante;
    app.innerHTML = `
      <header class="top reveal">
        <h1 class="sr-only">${esc(cfg.nome)}</h1>
        ${cfg.logo?.arquivo ? `<div class="logo"><img src="${esc(asset(cfg.logo.arquivo))}"${cfg.logo.w ? ` width="${+cfg.logo.w}" height="${+cfg.logo.h}"` : ''} alt="${esc(cfg.nome)}" decoding="async"></div>` : ''}
        ${cfg.tagline ? `<p class="tagline" data-f="tagline" data-raw="${esc(cfg.tagline)}"${zk('topo', 'tagline')}>${nl(cfg.tagline).replace(/\{([^}]+)\}/g, '<em>$1</em>')}</p>` : ''}
        ${cfg.numeros?.length ? `<div class="stats" aria-label="Números do perfil">${cfg.numeros.map((n, i) => `<div class="stat"><b data-f="numeros.${i}.valor"${zk('topo', 'numeros' + i + 'valor')}>${esc(n.valor)}</b><span data-f="numeros.${i}.rotulo"${zk('topo', 'numeros' + i + 'rotulo')}>${esc(n.rotulo)}</span></div>`).join('')}</div>` : ''}
      </header>
      ${usedCats.length > 1 ? `<nav class="filters reveal" aria-label="Filtrar">
        <button class="chip" type="button" data-filter="todos" aria-pressed="true">Todos</button>
        ${usedCats.map(k => `<button class="chip" type="button" data-filter="${esc(k)}" aria-pressed="false">${esc(cats[k])}</button>`).join('')}
      </nav>` : ''}
      <section class="cards${MODE === 'pc' && Object.keys(WM).length ? ' manual' : ''}${MODE === 'cel' && Object.values(WM).includes('meia') ? ' mcel' : ''}">${(() => {
        const base = [...(cfg.cards || [])], all = [];
        const byId = new Map(base.map(c => [c.id, c]));
        (LY.ordem || []).forEach(i => { if (byId.has(i)) { all.push(byId.get(i)); byId.delete(i); } });
        byId.forEach(c => all.push(c));
        const manual = MODE === 'pc' && Object.keys(WM).length > 0;
        let last = -1; all.forEach((c, i) => { if (c.tipo === 'parceiro' && c.imagem) last = i; });
        if (last >= 0 && !manual) all[last] = { ...all[last], _last: true };
        if (!manual && MODE === 'pc') {
          /* auto: fecha cada linha de 3 colunas (sobra 2 -> 2 metades; sobra 1 -> 4 metades) */
          const full = c => c.tipo === 'capa' || (c.tipo === 'parceiro' && !c.imagem);
          for (let i = 0; i < all.length;) {
            if (full(all[i])) { i++; continue; }
            let j = i; while (j < all.length && !full(all[j])) j++;
            const n = j - i, k = n % 3 === 2 ? 2 : n % 3 === 1 && n >= 4 ? 4 : 0;
            for (let m = j - k; m < j; m++) all[m] = { ...all[m], _w: 'meia' };
            i = j;
          }
        }
        return all.map(card).join('');
      })()}</section>
      <footer>
        <strong>© ${esc(cfg.nome)}</strong><br>
        <a class="credit" href="https://www.creativecodex.com.br/" target="_blank" rel="noopener" aria-label="Desenvolvido por BlinkBio, Creative Codex Studio"><img src="assets/logo-dark.png" width="208" height="52" alt="BlinkBio by Creative Codex" loading="lazy" decoding="async"></a>
      </footer>`;
    $('#fab-slot').innerHTML = fabC?.texto ? `<a class="fab" id="fab" data-id="${esc(fabC.id || 'fab')}" target="_blank" rel="noopener" aria-label="${esc(fabC.aria || fabC.texto)}" href="${esc(url(fabC.link))}">${esc(fabC.texto)} ${ARROW}</a>` : '';

    /* Interações */
    track('page_view', { ref: document.referrer });
    document.addEventListener('click', e => {
      const el = e.target.closest('a, button');
      if (!el) return;
      const owner = el.closest('[data-id]');
      if (!owner) return;
      const kind = el.dataset.code ? 'copiar_cupom' : el.matches('.chip') ? 'filtro' : 'abrir_link';
      track(kind, { id: owner.dataset.id, cupom: el.dataset.code || undefined });
    }, sig);

    const toast = $('#toast');
    const show = msg => {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(show.t);
      show.t = setTimeout(() => toast.classList.remove('show'), 1900);
    };
    async function copy(text) {
      try { await navigator.clipboard.writeText(text); }
      catch {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch {}
        ta.remove();
      }
    }
    $$('[data-code]').forEach(btn => {
      const lbl = $('.lbl', btn);
      btn.addEventListener('click', async () => {
        await copy(btn.dataset.code);
        btn.classList.add('done');
        lbl.textContent = 'Copiado ✓';
        show(`Cupom ${btn.dataset.code} copiado`);
        try { navigator.vibrate && navigator.vibrate(20); } catch {}
        setTimeout(() => { btn.classList.remove('done'); lbl.textContent = 'Copiar'; }, 2000);
      });
    });
    $$('a.go[href="#"]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); show('Link em breve'); }));
    if (EMBED) { $$('a[target=_blank]').forEach(a => a.addEventListener('click', e => e.preventDefault())); applyCanvas(); }

    /* Revelar ao rolar */
    const reveals = $$('.reveal');
    if ('IntersectionObserver' in window && !EMBED) {
      io = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold: .12 });
      reveals.forEach((el, i) => { el.style.transitionDelay = Math.min(i, 4) * 60 + 'ms'; io.observe(el); });
    } else {
      reveals.forEach(el => el.classList.add('in'));
    }

    /* Filtros */
    const chips = $$('.chip');
    const items = $$('[data-cat]');
    chips.forEach(chip => chip.addEventListener('click', () => {
      const f = chip.dataset.filter;
      chips.forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
      items.forEach(el => { el.hidden = !(f === 'todos' || el.dataset.cat === f); if (!el.hidden) el.classList.add('in'); });
    }));

    /* Botão flutuante após a capa */
    const fab = $('#fab'), hero = $('#hero');
    if (fab) {
      const onScroll = () => fab.classList.toggle('show', hero ? hero.getBoundingClientRect().bottom < 0 : scrollY > 400);
      addEventListener('scroll', onScroll, { passive: true, signal: ac.signal });
      onScroll();
    }
    if (keepY) scrollTo(0, keepY);

    /* Fundo em movimento (uma vez) */
    const bg = $('.bg');
    if (!bgOn && bg && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      bgOn = true;
      let tx = 0, ty = 0, ts = 0, cx = 0, cy = 0, cs = 0, raf = 0;
      const loop = () => {
        cx += (tx - cx) * .08; cy += (ty - cy) * .08; cs += (ts - cs) * .1;
        bg.style.setProperty('--mx', cx.toFixed(3));
        bg.style.setProperty('--my', cy.toFixed(3));
        bg.style.setProperty('--sp', cs.toFixed(3));
        const moving = Math.abs(tx - cx) > .001 || Math.abs(ty - cy) > .001 || Math.abs(ts - cs) > .001;
        raf = moving ? requestAnimationFrame(loop) : 0;
      };
      const kick = () => { if (!raf) raf = requestAnimationFrame(loop); };
      addEventListener('scroll', () => { ts = Math.min(scrollY, 900) / 900; kick(); }, { passive: true });
      addEventListener('pointermove', e => {
        if (e.pointerType !== 'mouse') return;
        tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; kick();
      }, { passive: true });
    }
  }

  /* Modo organizar: arrastar, escolher largura e selecionar cards na prévia */
  let CANVAS = false, SEL = '';
  const post = m => parent.postMessage({ ...m, m: matchMedia('(min-width: 760px)').matches ? 'pc' : 'cel' }, location.origin);
  function applyCanvas() {
    document.body.classList.toggle('cv', CANVAS);
    $$('.cv-bar').forEach(x => x.remove());
    $$('.cards > .card').forEach(c => {
      c.draggable = CANVAS;
      c.classList.toggle('sel', CANVAS && c.dataset.id === SEL);
      if (CANVAS && c.dataset.id === SEL) {
        const w = c.dataset.w || '', hero = c.classList.contains('hero'), pc = matchMedia('(min-width: 760px)').matches;
        const b = (a, t, on, title) => `<button type="button" data-cv="${a}" title="${title}" aria-label="${title}"${on ? ' class="on"' : ''}>${t}</button>`;
        c.insertAdjacentHTML('beforeend', `<div class="cv-bar">${hero ? '' : (pc ? b('w:terco', '⅓', w === 'terco', 'Largura 1/3') : '') + b('w:meia', '½', w === 'meia', 'Meia largura') + b('w:cheia', '▭', w === 'cheia', 'Largura total') + b('w:auto', 'Auto', !w, 'Largura automática') + '<i></i>'}${b('mv:-1', '←', 0, 'Mover para antes')}${b('mv:1', '→', 0, 'Mover para depois')}${b('dup', '⧉', 0, 'Duplicar')}${b('del', '✕', 0, 'Remover')}</div>`);
      }
    });
    $$('.cards img').forEach(i => (i.draggable = false));
  }
  function initCanvas() {
    let drag = null, drop = null;
    const clear = () => $$('.dt-before,.dt-after,.dragging').forEach(x => x.classList.remove('dt-before', 'dt-after', 'dragging'));
    let EDIT = null, TX = null, K = 1, K0 = 1;
    const szKey = el => { const c = el.closest('.cards > .card'); return (c ? c.dataset.id : 'topo') + '.' + el.dataset.f.replace(/\./g, ''); };
    const killTx = () => { TX?.remove(); TX = null; };
    const endEdit = (save, el) => {
      if (EDIT !== el) return; EDIT = null; killTx();
      const v = (el.innerText || '').replace(/\r/g, '').replace(/[ \t]+/g, ' ').replace(/ ?\n ?/g, '\n').replace(/\n{3,}/g, '\n\n').trim(), old = el.dataset.old;
      el.removeAttribute('contenteditable'); const card = el.closest('.cards > .card'); if (card) card.draggable = CANVAS;
      const kk = save && K !== K0;
      if (save && (v !== old || kk)) post({ type: 'bb-text', id: card ? card.dataset.id : '', f: el.dataset.f, v, k: K, key: szKey(el) });
      else { el.style.zoom = K0 === 1 ? '' : K0; el.innerHTML = el.dataset.f === 'tagline' ? esc(el.dataset.raw).replace(/\n/g, '<br>').replace(/\{([^}]+)\}/g, '<em>$1</em>') : esc(old).replace(/\n/g, '<br>'); }
    };
    const ins = t => document.execCommand('insertText', false, t);
    const startEdit = el => {
      if (EDIT === el) return; if (EDIT) endEdit(true, EDIT);
      EDIT = el; const raw = el.dataset.f === 'tagline' ? el.dataset.raw : (el.innerText || el.textContent).replace(/\n$/, '');
      el.dataset.old = raw; el.textContent = raw; K = K0 = +(el.style.zoom || 1) || 1;
      const card = el.closest('.cards > .card'); if (card) card.draggable = false;
      el.setAttribute('contenteditable', 'plaintext-only'); if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
      el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r);
      el.onblur = () => endEdit(true, el);
      el.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.blur(); } else if (e.key === 'Enter') { e.preventDefault(); ins('\n'); } else if (e.key === 'Escape') { e.preventDefault(); endEdit(false, el); el.blur(); } e.stopPropagation(); };
      /* barra: tamanho, destaque e quebra de linha */
      killTx(); TX = document.createElement('div'); TX.className = 'cv-tx';
      const lbl = () => Math.round(K * 100) + '%';
      TX.innerHTML = `<button type="button" data-tx="-" title="Diminuir texto">A−</button><span>${lbl()}</span><button type="button" data-tx="+" title="Aumentar texto">A+</button><i></i><button type="button" data-tx="br" title="Quebrar linha aqui (Shift+Enter)">↵ Linha</button>${el.dataset.f === 'tagline' ? '<button type="button" data-tx="em" title="Destacar a palavra selecionada com a cor da marca">Destaque</button>' : ''}`;
      const rc = el.getBoundingClientRect(); TX.style.left = Math.max(6, Math.min(innerWidth - 230, rc.left)) + 'px'; TX.style.top = Math.max(44, rc.top) + 'px';
      TX.addEventListener('mousedown', e => e.preventDefault());
      TX.addEventListener('click', e => {
        const t = e.target.closest('[data-tx]')?.dataset.tx; if (!t) return;
        if (t === '-' || t === '+') { K = Math.max(.5, Math.min(2.5, Math.round((K + (t === '+' ? .1 : -.1)) * 100) / 100)); el.style.zoom = K === 1 ? '' : K; TX.querySelector('span').textContent = lbl(); }
        else if (t === 'br') ins('\n');
        else if (t === 'em') { const x = getSelection().rangeCount ? getSelection().getRangeAt(0).toString() : ''; if (x && !/[{}]/.test(x)) ins('{' + x + '}'); }
      });
      document.body.append(TX);
    };
    document.addEventListener('click', e => {
      if (!CANVAS) return;
      if (EDIT && EDIT.contains(e.target)) { e.preventDefault(); return; }
      const fe = e.target.closest('[data-f]');
      if (fe && !e.target.closest('[data-cv]')) {
        e.preventDefault(); e.stopPropagation();
        startEdit(fe); return;
      }
      const bt = e.target.closest('[data-cv]'), card = e.target.closest('.cards > .card');
      if (!card) return;
      e.preventDefault(); e.stopPropagation();
      if (bt) { const [act, v] = bt.dataset.cv.split(':'); post({ type: 'bb-act', act, id: card.dataset.id, v }); return; }
      SEL = card.dataset.id; applyCanvas(); post({ type: 'bb-select', id: SEL });
    }, true);
    document.addEventListener('dragstart', e => {
      const card = CANVAS && e.target.closest?.('.cards > .card'); if (!card) return;
      drag = card.dataset.id; card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag);
    });
    document.addEventListener('dragover', e => {
      if (!drag) return;
      const t = e.target.closest?.('.cards > .card'); if (!t || t.dataset.id === drag) return;
      e.preventDefault();
      const r = t.getBoundingClientRect(), wide = r.width > t.parentElement.clientWidth * .9;
      const before = wide ? e.clientY < r.top + r.height / 2 : e.clientX < r.left + r.width / 2;
      $$('.dt-before,.dt-after').forEach(x => x.classList.remove('dt-before', 'dt-after'));
      t.classList.add(before ? 'dt-before' : 'dt-after'); drop = { id: t.dataset.id, before };
    });
    document.addEventListener('drop', e => {
      if (!drag || !drop) return; e.preventDefault();
      const ids = $$('.cards > .card').map(c => c.dataset.id).filter(i => i !== drag);
      const at = ids.indexOf(drop.id) + (drop.before ? 0 : 1); ids.splice(at, 0, drag);
      post({ type: 'bb-order', ids });
    });
    document.addEventListener('dragend', () => { drag = drop = null; clear(); });
  }

  /* Troca de layout ao cruzar o ponto de quebra (celular <-> PC) */
  let curCfg = null, curSlug = '';
  matchMedia('(min-width: 760px)').addEventListener('change', () => { if (curCfg) mount(curCfg, curSlug); });

  /* Início */
  if (EMBED) {
    addEventListener('message', e => {
      if (e.origin !== location.origin) return;
      const d = e.data || {};
      if (d.type === 'bb-config') { CANVAS = !!d.canvas; SEL = d.sel || ''; mount(d.cfg, d.slug); }
      else if (d.type === 'bb-canvas') { CANVAS = !!d.on; SEL = d.sel || ''; applyCanvas(); }
    });
    initCanvas();
    parent.postMessage({ type: 'bb-ready' }, location.origin);
    return;
  }
  const slug = (params.get('c') || document.documentElement.dataset.default || '').toLowerCase();
  try {
    if (!/^[a-z0-9-]{1,32}$/.test(slug)) throw 0;
    mount(await loadConfig(slug), slug);
  } catch {
    document.title = 'Página não encontrada';
    app.innerHTML = '<header class="top"><p class="tagline">Página não encontrada.</p></header>';
  }
})();
</script>
</body>
</html>

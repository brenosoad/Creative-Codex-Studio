<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0D0B1A">
<title>Painel | Creative Codex</title>
<link rel="icon" href="img/logo.png?v=2" type="image/png">
<link rel="apple-touch-icon" href="img/logo.png">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0D0B1A;--panel:#17142B;--panel2:#1d1a35;--line:#2A2640;--text:#F4F3F8;--dim:#A29FB8;
  --brand:#8B7CFF;--brand-d:#4B32D9;--green:#34d399;--red:#f87171;--amber:#fbbf24;
  --r:14px;--mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Satoshi','DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.17em}

/* sidebar */
.side{width:232px;flex:none;position:fixed;inset:0 auto 0 0;background:var(--bg);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:26px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:900;font-size:1.05rem;letter-spacing:-.01em}
.brand svg{width:34px;height:22px}
.brand small{display:block;font:500 .68rem var(--mono);color:var(--dim);letter-spacing:.02em;margin-top:2px}
.nav{display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:.7rem .8rem;border-radius:10px;border:0;background:none;color:var(--dim);font-weight:500;font-size:.95rem;text-align:left;width:100%;position:relative;transition:background .15s,color .15s}
.nav button:hover{background:var(--panel);color:var(--text)}
.nav button.on{background:var(--panel);color:var(--text);box-shadow:inset 3px 0 0 var(--brand)}
.nav .badge{margin-left:auto;font:700 .7rem var(--mono);background:var(--red);color:#1a0b0b;border-radius:99px;padding:.1rem .45rem;min-width:20px;text-align:center}
.side-foot{margin-top:auto;padding:0 8px;font-size:.8rem;color:var(--dim);display:grid;gap:8px}
.sync{display:flex;align-items:center;gap:8px;font:500 .72rem var(--mono)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync.busy i{background:var(--amber)}.sync.err i{background:var(--red)}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;text-underline-offset:3px;font-size:.8rem;text-align:left;padding:0}
.link:hover{color:var(--text)}

/* main */
.main{margin-left:232px;flex:1;min-width:0;padding:30px clamp(18px,3vw,40px) 60px;max-width:1360px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.top h1{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:900;letter-spacing:-.02em;line-height:1.1}
.top p{color:var(--dim);font-size:.92rem;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.7rem 1.1rem;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:.92rem;transition:transform .15s,background .15s,border-color .15s}
.btn.pri{background:var(--brand-d);color:#fff}.btn.pri:hover{background:#5a40ea}
.btn.gh{background:var(--panel);border-color:var(--line)}.btn.gh:hover{border-color:var(--brand)}
.btn.sm{padding:.45rem .75rem;font-size:.82rem;border-radius:8px}
.btn.wa{background:#1f9d55;color:#fff}.btn.wa:hover{background:#25b563}
.btn.dg{background:none;color:var(--red);border-color:rgba(248,113,113,.35)}
.btn{text-decoration:none}.btn:active{transform:scale(.98)}

/* cards */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .more{margin-left:auto}
.lbl{font:500 .72rem var(--mono);color:var(--dim);letter-spacing:.03em;text-transform:none}
.big{font-family:var(--mono);font-weight:700;font-size:clamp(1.7rem,3.4vw,2.5rem);letter-spacing:-.03em;line-height:1.05;margin:8px 0 4px}
.kpi .big{font-size:clamp(1.4rem,2.4vw,1.8rem)}
.sub{font-size:.82rem;color:var(--dim)}
.hero{background:var(--brand-d);border-color:transparent}
.hero .lbl,.hero .sub{color:rgba(255,255,255,.78)}
.hero.alt{background:#1b2a3a}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}
.sec{font-size:1rem;font-weight:700;margin:26px 0 12px}
.alert{display:flex;gap:10px;align-items:center;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:#fecaca;border-radius:var(--r);padding:.8rem 1rem;margin-bottom:16px;font-size:.92rem}
.alert button{margin-left:auto}

/* goal */
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.ok i{background:var(--green)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}

/* chart */
.chart{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.col b{font:700 .72rem var(--mono);color:var(--text);white-space:nowrap}
.col em{font:500 .72rem var(--mono);color:var(--dim);font-style:normal}
.col span{display:block;width:100%;max-width:46px;background:var(--brand);border-radius:6px 6px 0 0;min-height:3px;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.col.now span{background:var(--brand-d)}
.col.cur span{background:#fff}
.funnel{display:grid;gap:10px}
.fr{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-size:.88rem}
.fr .bar{height:12px}
.fr b{font-family:var(--mono);text-align:right}

/* filters */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim)}
.search input{width:100%;padding:.7rem .9rem .7rem 2.3rem;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.search input:focus{border-color:var(--brand);outline:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:.4rem .85rem;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-weight:700;font-size:.82rem}
.chip b{font-family:var(--mono);font-weight:500;margin-left:6px;opacity:.8}
.chip.on{background:var(--brand-d);border-color:var(--brand-d);color:#fff}

/* table */
.tw{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:.8rem 1rem;font:500 .72rem var(--mono);color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--text)}th.s.on{color:var(--brand)}
td{padding:.85rem 1rem;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:rgba(255,255,255,.025)}
tr.clk{cursor:pointer}
.nm{font-weight:700}.ct{font-size:.8rem;color:var(--dim);margin-top:1px}
.val{font-family:var(--mono);font-weight:700;white-space:nowrap}
.tag{display:inline-block;margin-left:6px;font:700 .65rem var(--mono);color:var(--green);background:rgba(52,211,153,.12);padding:.12rem .4rem;border-radius:6px}
.st{display:inline-flex;align-items:center;gap:6px;padding:.28rem .7rem;border-radius:99px;font-size:.78rem;font-weight:700;border:0;appearance:none;-webkit-appearance:none}
select.st{padding-right:.7rem;cursor:pointer}
.st.prospectando{background:rgba(162,159,184,.16);color:#d4d1e6}
.st.semresposta{background:rgba(125,211,252,.14);color:#7dd3fc}
.st.negociando{background:rgba(251,191,36,.15);color:var(--amber)}
.st.fechado{background:rgba(52,211,153,.15);color:var(--green)}
.st.perdido{background:rgba(248,113,113,.15);color:var(--red)}
.nc{font-size:.85rem;color:var(--dim)}.nc.over{color:var(--red);font-weight:700}.nc.today{color:var(--amber);font-weight:700}
.acts{display:flex;gap:4px;justify-content:flex-end}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:0;background:none;color:var(--dim)}
.ib:hover{background:var(--panel2);color:var(--text)}.ib.del:hover{color:var(--red)}
.empty{padding:50px 20px;text-align:center;color:var(--dim)}
.empty svg{width:34px;height:34px;opacity:.5;margin-bottom:10px}

/* hoje */
.todo{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;flex-wrap:wrap}
.item .info{flex:1;min-width:200px}
.item.over{border-left:3px solid var(--red)}.item.today{border-left:3px solid var(--amber)}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:200px}
.kc.over{border-color:var(--brand);background:var(--panel2)}
.kc h4{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:2px 4px 10px}
.kc h4 .n{margin-left:auto;font:500 .75rem var(--mono);color:var(--dim)}
.kc h4 .sumv{font:500 .72rem var(--mono);color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%}
.kcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:grab;transition:border-color .15s,transform .15s}
.kcard:hover{border-color:var(--brand)}
.kcard.drag{opacity:.4}
.kcard .nm{font-size:.92rem}
.kcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.78rem;color:var(--dim);gap:8px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,4,12,.72);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.modal.sm{max-width:400px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.modal h2{font-size:1.2rem;font-weight:900;margin-bottom:16px;letter-spacing:-.01em}
.f{margin-bottom:14px}
.f label{display:block;font:500 .74rem var(--mono);color:var(--dim);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:.7rem .85rem;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);outline:0}
.f textarea{resize:vertical;min-height:70px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:.78rem;margin-top:5px;color:var(--dim)}.hint.ok{color:var(--green)}
.f label.ck,label.ck{font:500 .88rem var(--sans);margin:0}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--dim);cursor:pointer}
.ck input{width:auto;margin-top:3px;accent-color:var(--brand)}
.ck strong{color:var(--text)}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.hist{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.hist h5{font:500 .74rem var(--mono);color:var(--dim);margin-bottom:10px}
.hi{display:flex;gap:10px;font-size:.85rem;padding:5px 0;color:var(--dim)}
.hi time{font:500 .72rem var(--mono);flex:none;width:78px;padding-top:2px}
.hi span{color:var(--text)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}

/* toast + login */
.kcard.lk{opacity:.55;cursor:default}
.pwb{position:relative}.pwb input{width:100%;padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;background:none;border:0;border-radius:8px;color:var(--dim,#A29FB8);cursor:pointer}
.eye:hover,.eye:focus-visible{color:#F4F3F8}.eye .sl{display:none}.eye[aria-pressed=true] .sl{display:block}
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:400;width:min(92vw,420px)}
.toast{background:#262244;border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;display:flex;gap:12px;align-items:center;font-size:.9rem;animation:pop .2s}
.toast.err{border-color:rgba(248,113,113,.5)}.toast.ok{border-color:rgba(52,211,153,.4)}
.toast button{margin-left:auto;background:none;border:0;color:var(--brand);font-weight:700}
.login{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;padding:20px}
.lb{width:100%;max-width:360px;text-align:center}
.lb svg.sym{width:64px;height:40px;margin-bottom:18px}
.lb h2{font-size:1.5rem;font-weight:900;letter-spacing:-.02em;margin-bottom:4px}
.lb p{color:var(--dim);font-size:.9rem;margin-bottom:22px}
.lb input{width:100%;padding:.85rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:center;font-size:1rem}
.lb input:focus{border-color:var(--brand);outline:0}
.lb .btn{width:100%;margin-top:12px}
.lb .er{color:var(--red);font-size:.85rem;margin-top:12px;min-height:1.2em}

body.intern .money{display:none!important}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.msg h4{font-size:.95rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.msg p{white-space:pre-wrap;color:var(--dim);font-size:.9rem;line-height:1.55;margin-bottom:12px}
.logl{display:flex;gap:12px;font-size:.86rem;padding:8px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.logl time{font:500 .72rem var(--mono);min-width:92px;padding-top:2px}
.logl b{color:var(--text);font-weight:600}

/* mobile */
.tabs{display:none}
@media (max-width:900px){
  .side{display:none}
  .main{margin-left:0;padding:20px 16px 96px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);z-index:30;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{background:none;border:0;color:var(--dim);display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:.68rem;font-weight:700;position:relative}
  .tabs button svg{width:22px;height:22px}
  .tabs.many{display:flex;overflow-x:auto;scrollbar-width:none}
  .tabs.many button{flex:0 0 66px;font-size:.6rem;padding:6px 0}
  .tabs.six button{font-size:.56rem;letter-spacing:-.03em;padding:6px 0}
  .tabs.six button svg{width:20px;height:20px}
  .tabs button.on{color:var(--brand)}
  .tabs .badge{position:absolute;top:2px;left:calc(50% + 8px);font:700 .62rem var(--mono);background:var(--red);color:#1a0b0b;border-radius:99px;padding:0 .35rem}
  .g2{grid-template-columns:1fr}
  .f2{grid-template-columns:1fr}
  .top .btn.pri{position:fixed;right:16px;bottom:82px;z-index:35;border-radius:99px;padding:.9rem 1.2rem;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  /* tabela vira cartões */
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tbody tr{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 10px}
  tbody tr:last-child{border-bottom:0}
  td{border:0;padding:0}
  td[data-l]::before{content:attr(data-l) ' ';font:500 .68rem var(--mono);color:var(--dim)}
  td.c-main{grid-column:1/-1}
  td.c-act{grid-column:1/-1}
  .acts{justify-content:flex-start}
  .kb{grid-template-columns:repeat(5,82vw);scroll-snap-type:x mandatory}
  .kc{scroll-snap-align:start}
  .fr{grid-template-columns:90px 1fr 30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/></symbol>

  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></symbol>
  <symbol id="i-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
  <symbol id="i-ul" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></symbol>
</svg>

<div class="login" id="login">
  <form class="lb" id="loginForm">
    <svg class="sym" viewBox="0 0 64 40" aria-hidden="true"><use href="#sym"/></svg>
    <h2>Painel Creative Codex</h2>
    <p>Digite sua senha de acesso</p>
    <label class="sr" for="pw" style="position:absolute;left:-9999px">Senha</label>
    <div class="pwb"><input type="password" id="pw" placeholder="Senha" autocomplete="current-password" required><button type="button" class="eye" id="pwEye" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" d="M4 4l16 16"/></svg></button></div>
    <button class="btn pri" type="submit" id="loginBtn">Entrar</button>
    <p class="er" id="loginErr" role="alert"></p>
  </form>
</div>

<aside class="side" id="side" hidden>
  <div class="brand"><svg viewBox="0 0 64 40" aria-hidden="true"><use href="#sym"/></svg><div>Painel<small>creative codex</small></div></div>
  <nav class="nav" id="nav" aria-label="Seções"></nav>
  <div class="side-foot">
    <div class="sync" id="sync"><i></i><span>Salvo</span></div>
    <span id="who"></span>
    <button class="link" data-act="logout">Sair</button>
  </div>
</aside>

<nav class="tabs" id="tabs" aria-label="Seções" hidden></nav>

<main class="main" id="main" hidden>
  <div class="top">
    <div><h1 id="title"></h1><p id="subtitle"></p></div>
    <button class="btn pri" data-act="new"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><use href="#i-plus"/></svg>Novo prospecto</button>
  </div>
  <div id="view"></div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ---------- estado ---------- */
const API = '/api/data';
const S = { token: null, role: null, users: {}, team: null, tpl: null, log: [], baks: [], prospects: [], goal: 0, goals: {}, deleted: [], view: 'overview', filter: 'todos', resp: 'todos', q: '', sort: 'date', dir: 'desc' };
const STATUS = { prospectando: 'Prospectando', semresposta: 'Sem resposta', negociando: 'Negociando', fechado: 'Fechado', perdido: 'Perdido' };
const STCOL = { prospectando: '#A29FB8', semresposta: '#7dd3fc', negociando: '#fbbf24', fechado: '#34d399', perdido: '#f87171' };
const who = (id) => id === 'dono' || !id ? 'Dono' : id === '*' ? 'Outra pessoa' : ((S.users[id] && S.users[id].name) || 'Funcionário');
const staff = () => Object.entries(S.users || {}).filter(([k, u]) => k !== 'dono' && u.active).map(([k, u]) => [k, u.name]);
const claim = (p) => p.claimedBy || (p.responsavel && p.responsavel !== 'dono' ? p.responsavel : '');
const locked = (p) => isIntern() && claim(p) && claim(p) !== S.role;
function take(p) { if (isIntern() && !claim(p)) { p.claimedBy = S.role; if (p.responsavel === 'dono') p.responsavel = S.role; touch(p, 'claim', 'Assumido por ' + who(S.role)); } }
const badge = (p) => claim(p) ? `<span class="tag">${claim(p) === S.role ? 'Seu' : isIntern() ? 'Em atendimento' : 'Em atendimento: ' + esc(who(claim(p)))}</span>` : (isIntern() ? '<span class="tag">Livre</span>' : '');
const $ = (s, r = document) => r.querySelector(s);
const ic = (n, c = '') => `<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (v) => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const moneyS = (v) => v >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k' : 'R$ ' + Math.round(v);
const isIntern = () => S.role !== 'dono';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const mkey = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const fdate = (iso) => iso ? new Date(iso.length === 10 ? iso + 'T00:00:00' : iso).toLocaleDateString('pt-BR') : '-';
const closedOf = (p) => p.closedAt || p.date;
const num = (v) => Number(v || 0);

function waLink(contact, text) {
  const d = String(contact || '').replace(/\D/g, '');
  if (d.length < 10) return null;
  const n = d.length <= 11 ? '55' + d : d;
  return 'https://wa.me/' + n + (text ? '?text=' + encodeURIComponent(text) : '');
}
function commission(v) {
  if (!v || v < 300) return null;
  if (v < 600) return 50;
  if (v < 1000) return v * 0.10;
  if (v < 1500) return v * 0.15;
  return null;
}
function nextInfo(p) {
  if (!p.nextContact) return { t: 'Sem data', c: '', d: null };
  const diff = Math.round((new Date(p.nextContact + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000);
  if (diff < 0) return { t: `Atrasado ${-diff}d`, c: 'over', d: diff };
  if (diff === 0) return { t: 'Hoje', c: 'today', d: 0 };
  if (diff === 1) return { t: 'Amanhã', c: '', d: 1 };
  return { t: fdate(p.nextContact), c: '', d: diff };
}
const isOpen = (p) => p.status === 'prospectando' || p.status === 'semresposta' || p.status === 'negociando';
const dueList = () => S.prospects.filter((p) => !locked(p) && isOpen(p) && p.nextContact && p.nextContact <= today()).sort((a, b) => a.nextContact.localeCompare(b.nextContact));

/* ---------- toast ---------- */
function toast(msg, o = {}) {
  const el = document.createElement('div');
  el.className = 'toast ' + (o.type || '');
  el.innerHTML = `<span>${esc(msg)}</span>` + (o.action ? `<button type="button">${esc(o.action)}</button>` : '');
  if (o.action) $('button', el).onclick = () => { o.onAction(); el.remove(); };
  $('#toasts').append(el);
  setTimeout(() => el.remove(), o.ms || 4200);
}

/* ---------- API ---------- */
async function api(method, body, qs = '') {
  const res = await fetch(API + qs, {
    method,
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && S.token) { logout(true); throw new Error('sessão'); }
  if (!res.ok) throw new Error(data.error || 'Erro ' + res.status);
  return data;
}
function applyServer(d) {
  S.prospects = d.prospects || [];
  S.goal = d.goal || 0;
  S.goals = d.goals || {};
  S.users = d.users || S.users || {};
}
function setSync(state, text) {
  const el = $('#sync'); if (!el) return;
  el.className = 'sync ' + state; $('span', el).textContent = text;
}
let saveT = null, saving = false, again = false;
function save() {
  setSync('busy', 'Salvando');
  clearTimeout(saveT);
  saveT = setTimeout(() => { saveT = null; flush(); }, 350);
}
async function flush() {
  if (saving) { again = true; return; }
  saving = true;
  const sent = S.deleted.slice();
  try {
    const d = await api('POST', { prospects: S.prospects, deleted: sent, goal: S.goal, goals: S.goals });
    S.deleted = S.deleted.filter((id) => !sent.includes(id));
    if (d.conflicts && d.conflicts.length) toast('Outra pessoa já assumiu este prospecto. A lista foi atualizada.', { type: 'err', ms: 6000 });
    if (!again && !S.deleted.length) applyServer(d);
    setSync('', 'Salvo');
  } catch (e) {
    if (e.message !== 'sessão') { setSync('err', 'Erro ao salvar'); toast('Não consegui salvar: ' + e.message, { type: 'err', action: 'Tentar de novo', onAction: flush }); }
  }
  saving = false;
  if (again) { again = false; flush(); } else render();
}
async function load(silent) {
  if (saveT || saving) return;
  try {
    const d = await api('GET');
    applyServer(d); setSync('', 'Salvo');
  } catch (e) {
    if (e.message !== 'sessão' && !silent) toast('Não consegui carregar os dados: ' + e.message, { type: 'err' });
    setSync('err', 'Sem conexão');
  }
  render();
}

/* ---------- sessão ---------- */
function boot() {
  const t = sessionStorage.getItem('painel_token'), r = sessionStorage.getItem('painel_role');
  if (t && r) { S.token = t; S.role = r; enter(); } else showLogin();
}
function showLogin() {
  $('#login').hidden = false; $('#side').hidden = $('#main').hidden = $('#tabs').hidden = true;
  setTimeout(() => $('#pw').focus(), 50);
}
function enter() {
  $('#login').hidden = true; $('#side').hidden = $('#main').hidden = $('#tabs').hidden = false;
  document.body.classList.toggle('intern', isIntern());
  $('#who').textContent = isIntern() ? who(S.role) + '' : 'Acesso completo';
  try { const f = JSON.parse(sessionStorage.getItem('painel_ui') || '{}'); Object.assign(S, { filter: f.filter || 'todos', resp: f.resp || 'todos', view: f.view || 'overview' }); } catch {}
  load(); loadTpl();
  if (S.view === 'team' && !isIntern()) loadTeam();
}
function logout(expired) {
  sessionStorage.removeItem('painel_token'); sessionStorage.removeItem('painel_role');
  S.token = S.role = null; S.prospects = [];
  showLogin();
  if (expired) $('#loginErr').textContent = 'Sessão expirada. Entre novamente.';
}
$('#pwEye').addEventListener('click', () => {
  const i = $('#pw'), on = i.type === 'password';
  i.type = on ? 'text' : 'password';
  $('#pwEye').setAttribute('aria-pressed', on); $('#pwEye').setAttribute('aria-label', on ? 'Ocultar senha' : 'Mostrar senha');
});
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const b = $('#loginBtn'); b.disabled = true; $('#loginErr').textContent = '';
  try {
    const d = await api('POST', { password: $('#pw').value }, '?action=login');
    S.token = d.token; S.role = d.role;
    sessionStorage.setItem('painel_token', d.token); sessionStorage.setItem('painel_role', d.role);
    $('#pw').value = ''; enter();
  } catch (err) { $('#loginErr').textContent = err.message; $('#pw').select(); }
  b.disabled = false;
});
function saveUI() { try { sessionStorage.setItem('painel_ui', JSON.stringify({ filter: S.filter, resp: S.resp, view: S.view })); } catch {} }

/* ---------- navegação ---------- */
const VIEWS = [
  ['overview', 'Visão geral', 'home'],
  ['today', 'Hoje', 'bell'],
  ['funnel', 'Funil', 'kanban'],
  ['list', 'Prospecção', 'users'],
  ['comm', 'Comissões', 'coin'],
  ['msgs', 'Mensagens', 'chat']
];
const views = () => isIntern() ? VIEWS : [...VIEWS, ['finance', 'Financeiro', 'chart'], ['team', 'Equipe', 'team']];
function renderNav() {
  const due = dueList().length;
  const nv = views().length;
  $('#tabs').classList.toggle('six', nv > 5 && nv < 7);
  $('#tabs').classList.toggle('many', nv > 6);
  $('#tabs').style.gridTemplateColumns = nv > 6 ? '' : `repeat(${nv},1fr)`;
  $('#who').textContent = isIntern() ? who(S.role) : 'Acesso completo';
  const html = (tab) => views().map(([k, n, i]) =>
    `<button type="button" data-act="view" data-v="${k}" class="${S.view === k ? 'on' : ''}" ${S.view === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${n}</span>${k === 'today' && due ? `<span class="badge">${due}</span>` : ''}</button>`).join('');
  $('#nav').innerHTML = html(); $('#tabs').innerHTML = html();
}
function setView(v) { S.view = v; saveUI(); render(); window.scrollTo(0, 0); if (v === 'team') loadTeam(); }

/* ---------- métricas ---------- */
function metrics() {
  const P = S.prospects, won = P.filter((p) => p.status === 'fechado'), lost = P.filter((p) => p.status === 'perdido'), open = P.filter(isOpen);
  const sum = (a) => a.reduce((s, p) => s + num(p.value), 0);
  const oneOff = won.filter((p) => !p.recurring), rec = won.filter((p) => p.recurring);
  const mk = mkey(new Date()), wonMonth = won.filter((p) => mkey(closedOf(p)) === mk);
  const decided = won.length + lost.length;
  return { P, won, lost, open, oneOff, rec, wonMonth, cash: sum(oneOff), mrr: sum(rec), monthVal: sum(wonMonth.filter((p) => !p.recurring)) + sum(wonMonth.filter((p) => p.recurring)),
    pipeVal: sum(open), lostVal: sum(lost), wonVal: sum(won), conv: decided ? Math.round(won.length / decided * 100) : 0, decided, mk, sum };
}
function months(n) {
  const out = [], now = new Date();
  for (let i = n - 1; i >= 0; i--) out.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
  return out;
}
function chartHtml(m, field) {
  const ms = months(6), now = mkey(new Date());
  const vals = ms.map((d) => {
    const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    const list = m.won.filter((p) => mkey(closedOf(p)) === k);
    return field === 'count' ? list.length : list.reduce((s, p) => s + num(p.value), 0);
  });
  const max = Math.max(1, ...vals);
  return `<div class="chart">${ms.map((d, i) => {
    const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    const lab = d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
    return `<div class="col ${k === now ? 'cur' : ''}"><b>${field === 'count' ? vals[i] : moneyS(vals[i])}</b><span style="height:${Math.max(2, Math.round(vals[i] / max * 100))}%" title="${esc(lab)}: ${field === 'count' ? vals[i] : money(vals[i])}"></span><em>${esc(lab)}</em></div>`;
  }).join('')}</div>`;
}

/* ---------- render ---------- */
function render() {
  if (!S.token) return;
  renderNav();
  if ((S.view === 'team' || S.view === 'finance') && isIntern()) S.view = 'overview';
  const v = views().find((x) => x[0] === S.view) || VIEWS[0];
  $('#title').textContent = v[1];
  const sub = {
    overview: () => new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }),
    today: () => { const n = dueList().length; return n ? `${n} contato${n > 1 ? 's' : ''} para fazer` : 'Nenhum contato pendente'; },
    funnel: () => 'Arraste os cartões entre as colunas',
    list: () => `${S.prospects.length} cadastrado${S.prospects.length === 1 ? '' : 's'}`,
    comm: () => 'Comissão por site fechado',
    msgs: () => 'Textos prontos para o WhatsApp',
    finance: () => 'Faturamento, comissões e lucro',
    team: () => 'Quem trabalha nos seus leads'
  };
  $('#subtitle').textContent = sub[S.view]();
  const el = $('#view');
  const focus = document.activeElement && document.activeElement.id === 'q' ? document.activeElement.selectionStart : null;
  el.innerHTML = ({ overview: vOverview, today: vToday, funnel: vFunnel, list: vList, comm: vComm, finance: vFinance, team: vTeam, msgs: vMsgs }[S.view])();
  if (S.view === 'funnel') bindDnD();
  if (focus !== null) { const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(focus, focus); } }
}

function rowSimple(p) {
  return `<tr class="clk" data-act="edit" data-id="${esc(p.id)}"><td class="c-main"><div class="nm">${esc(p.name)}</div>${p.contact ? `<div class="ct">${esc(p.contact)}</div>` : ''}</td><td>${esc(p.service || '-')}</td><td class="val money">${p.value == null ? '' : money(p.value)}${p.recurring ? '<span class="tag">/mês</span>' : ''}</td><td><span class="st ${p.status}">${STATUS[p.status]}</span></td><td class="nc">${fdate(p.date)}</td></tr>`;
}

function vOverview() {
  const m = metrics(), due = dueList();
  const goal = S.goals[m.mk] ?? S.goal ?? 0, pct = goal > 0 ? Math.min(100, Math.round(m.monthVal / goal * 100)) : 0;
  const upcoming = S.prospects.filter((p) => isOpen(p) && p.nextContact && p.nextContact >= today()).sort((a, b) => a.nextContact.localeCompare(b.nextContact)).slice(0, 4);
  const recent = S.prospects.slice().sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
  const fmax = Math.max(1, S.prospects.length);
  const money_ = !isIntern();
  return `
  ${due.length ? `<div class="alert" role="status">${ic('bell')}<span><b>${due.length}</b> contato${due.length > 1 ? 's' : ''} para fazer hoje ou atrasado${due.length > 1 ? 's' : ''}.</span><button class="btn sm gh" data-act="view" data-v="today">Ver agora</button></div>` : ''}
  ${money_ ? `<div class="grid g2" style="margin-bottom:14px">
    <div class="card hero"><div class="lbl">Total em caixa</div><div class="big">${money(m.cash)}</div><div class="sub">${m.oneOff.length ? `${m.oneOff.length} negócio${m.oneOff.length > 1 ? 's' : ''} avulso${m.oneOff.length > 1 ? 's' : ''} fechado${m.oneOff.length > 1 ? 's' : ''}` : 'Nenhum negócio avulso fechado'}</div></div>
    <div class="card hero alt"><div class="lbl">Receita recorrente (MRR)</div><div class="big">${money(m.mrr)}</div><div class="sub">${m.rec.length ? `${m.rec.length} cliente${m.rec.length > 1 ? 's' : ''} pagando por mês` : 'Nenhum contrato recorrente'}</div></div>
  </div>
  <div class="card" style="margin-bottom:14px">
    <div class="row"><h3 style="margin:0">${ic('target')}Meta do mês</h3><button class="link" data-act="goal">Editar meta</button></div>
    <div class="row" style="margin:12px 0 8px"><span class="sub"><b class="mono" style="color:var(--text)">${money(m.monthVal)}</b> fechados em ${new Date().toLocaleDateString('pt-BR', { month: 'long' })}</span><span class="sub mono">${goal > 0 ? `Meta ${money(goal)} (${pct}%)` : 'Sem meta definida'}</span></div>
    <div class="bar ${pct >= 100 ? 'ok' : ''}"><i style="width:${pct}%"></i></div>
  </div>` : ''}
  <div class="grid g4">
    <div class="card kpi"><div class="lbl">Prospectos</div><div class="big">${m.P.length}</div><div class="sub">${m.open.length} em andamento</div></div>
    <div class="card kpi"><div class="lbl">Fechados</div><div class="big pos">${m.won.length}</div><div class="sub">${money_ ? money(m.wonVal) + ' no total' : m.wonMonth.length + ' neste mês'}</div></div>
    <div class="card kpi"><div class="lbl">Em aberto</div><div class="big warn">${m.open.length}</div><div class="sub">${money_ ? money(m.pipeVal) + ' no funil' : 'negociando ou prospectando'}</div></div>
    <div class="card kpi"><div class="lbl">Conversão</div><div class="big">${m.conv}%</div><div class="sub">${m.decided ? `${m.won.length} de ${m.decided} decididos` : 'Sem negócios decididos'}</div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3>${money_ ? 'Fechado por mês (R$)' : 'Fechados por mês'}</h3>${chartHtml(m, money_ ? 'value' : 'count')}</div>
    <div class="card"><h3>Funil</h3><div class="funnel">${Object.keys(STATUS).map((k) => { const n = m.P.filter((p) => p.status === k).length; return `<div class="fr"><span>${STATUS[k]}</span><div class="bar"><i style="width:${Math.round(n / fmax * 100)}%;background:${STCOL[k]}"></i></div><b>${n}</b></div>`; }).join('')}</div>
      ${upcoming.length ? `<h3 style="margin-top:20px">Próximos contatos</h3><div class="funnel">${upcoming.map((p) => `<div class="row"><span class="nm" style="font-size:.9rem">${esc(p.name)}</span><span class="nc">${nextInfo(p).t}</span></div>`).join('')}</div>` : ''}</div>
  </div>
  <h2 class="sec">Adicionados recentemente</h2>
  <div class="tw">${recent.length ? `<table><tbody>${recent.map(rowSimple).join('')}</tbody></table>` : `<div class="empty">${ic('users')}<p>Nada por aqui ainda. Cadastre o primeiro prospecto.</p></div>`}</div>`;
}

function vToday() {
  const due = dueList();
  const none = S.prospects.filter((p) => !locked(p) && isOpen(p) && !p.nextContact);
  const card = (p) => {
    const n = nextInfo(p), wa = waLink(p.contact, `Olá, ${p.name.split(' ')[0]}! Tudo bem?`);
    return `<div class="item ${n.c}"><div class="info"><div class="nm">${esc(p.name)} <span class="st ${p.status}" style="margin-left:6px">${STATUS[p.status]}</span></div><div class="ct">${esc(p.service || 'Sem serviço')}${p.contact ? ' | ' + esc(p.contact) : ''}</div></div>
      <span class="nc ${n.c}">${n.t}</span>

function bindDnD() {

function filtered() {
  let l = S.prospects.slice();
  if (S.filter === 'todos') l = l.filter((p) => p.status !== 'perdido');
  else l = l.filter((p) => p.status === S.filter);
  if (S.resp === 'livres') l = l.filter((p) => !claim(p));
  else if (S.resp === 'meus') l = l.filter((p) => claim(p) === S.role);
  else if (S.resp !== 'todos') l = l.filter((p) => p.responsavel === S.resp);
  const q = S.q.trim().toLowerCase();
  if (q) l = l.filter((p) => (p.name + ' ' + (p.service || '') + ' ' + (p.contact || '')).toLowerCase().includes(q));
  const k = S.sort, d = S.dir === 'asc' ? 1 : -1;
  l.sort((a, b) => {
    let x = a[k], y = b[k];
    if (k === 'date') { x = new Date(x); y = new Date(y); }
    else if (k === 'value') { x = num(x); y = num(y); }
    else if (k === 'next') { x = a.nextContact || '9999'; y = b.nextContact || '9999'; }
    else { x = String(x || '').toLowerCase(); y = String(y || '').toLowerCase(); }
    return x < y ? -d : x > y ? d : 0;
  });
  return l;
}

/* ---------- financeiro (só o dono) ---------- */
function vFinance() {
  const m = metrics();
  const pay = m.won.filter((p) => p.responsavel !== 'dono');
  const cm = (p) => commission(num(p.value));
  const sumC = (a) => a.reduce((t, p) => t + (cm(p) || 0), 0);
  const totalC = sumC(pay), paidC = sumC(pay.filter((p) => p.commissionPaid)), dueC = totalC - paidC;
  const combinar = pay.filter((p) => num(p.value) >= 1500 && !p.commissionPaid).length;
  const net = m.wonVal - totalC;
  const people = [...new Set(pay.map((p) => p.responsavel))].map((id) => {
    const l = pay.filter((p) => p.responsavel === id);
    return { id, n: l.length, rev: m.sum(l), tot: sumC(l), paid: sumC(l.filter((p) => p.commissionPaid)), comb: l.filter((p) => num(p.value) >= 1500 && !p.commissionPaid).length };
  }).sort((a, b) => b.rev - a.rev);
  const ms = months(6).reverse().map((d) => {
    const k = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    const l = m.won.filter((p) => mkey(closedOf(p)) === k);
    const c = sumC(l.filter((p) => p.responsavel !== 'dono')), rev = m.sum(l);
    return { label: d.toLocaleDateString('pt-BR', { month: 'long' }).replace(/^./, (c) => c.toUpperCase()) + ' de ' + d.getFullYear(), n: l.length, rev, c, net: rev - c };
  });
  const k = (lbl, big, sub, cls = '') => `<div class="card kpi"><div class="lbl">${lbl}</div><div class="big ${cls}">${big}</div><div class="sub">${sub}</div></div>`;
  return `<div class="grid g4" style="margin-bottom:14px">
    ${k('Faturamento total', money(m.wonVal), `${m.won.length} venda${m.won.length === 1 ? '' : 's'} fechada${m.won.length === 1 ? '' : 's'}`, 'pos')}
    ${k('Neste mês', money(m.monthVal), `${m.wonMonth.length} fechada${m.wonMonth.length === 1 ? '' : 's'}`)}
    ${k('Comissões a pagar', money(dueC), combinar ? `+ ${combinar} a combinar` : 'em aberto', 'warn')}
    ${k('Lucro após comissões', money(net), `${money(paidC)} já pagos em comissão`, net >= 0 ? 'pos' : '')}
  </div>
  <h2 class="sec">Por funcionário</h2>
  ${people.length ? `<div class="tw"><table><thead><tr><th>Nome</th><th>Vendas</th><th>Faturamento</th><th>Comissão</th><th>Paga</th><th>A pagar</th></tr></thead><tbody>${people.map((x) => `<tr><td class="c-main"><div class="nm">${esc(who(x.id))}</div></td><td data-l="Vendas">${x.n}</td><td data-l="Faturamento" class="money">${money(x.rev)}</td><td data-l="Comissão" class="money">${money(x.tot)}${x.comb ? ` <span class="tag">+${x.comb} a combinar</span>` : ''}</td><td data-l="Paga" class="money">${money(x.paid)}</td><td data-l="A pagar" class="money"><b>${money(x.tot - x.paid)}</b></td></tr>`).join('')}</tbody></table></div><div class="hint" style="margin:8px 2px 0">Para marcar uma comissão como paga, use a aba Comissões.</div>` : '<div class="card empty"><p>Nenhuma venda de funcionário fechada ainda.</p></div>'}
  <h2 class="sec">Por mês</h2>
  <div class="tw"><table><thead><tr><th>Mês</th><th>Vendas</th><th>Faturamento</th><th>Comissões</th><th>Líquido</th></tr></thead><tbody>${ms.map((x) => `<tr><td class="c-main"><div class="nm">${esc(x.label)}</div></td><td data-l="Vendas">${x.n}</td><td data-l="Faturamento" class="money">${money(x.rev)}</td><td data-l="Comissões" class="money">${money(x.c)}</td><td data-l="Líquido" class="money"><b>${money(x.net)}</b></td></tr>`).join('')}</tbody></table></div>`;
}

function touch(p, histType, text) {
  p.updatedAt = Date.now();

}
function setStatus(id, status, reason) {
  const p = S.prospects.find((x) => x.id === id);
  if (!p || p.status === status) return;
  if (locked(p)) { toast('Outra pessoa já está atendendo este prospecto.', { type: 'err' }); render(); return; }
  if (status === 'perdido' && reason === undefined) {
    dialog({ title: 'Motivo da perda', body: `<div class="f"><label for="dReason">Por que não fechou? (opcional)</label><input id="dReason" placeholder="Ex: achou caro, sumiu, escolheu outro"></div>`, ok: 'Marcar como perdido',
      onOk: (d) => setStatus(id, status, $('#dReason', d).value.trim()), onCancel: () => render() });
    return;
  }
  take(p);
  const old = p.status;
  p.status = status;
  if (status === 'fechado') { p.closedAt = new Date().toISOString(); p.nextContact = ''; }
  else if (old === 'fechado') p.closedAt = null;
  if (status === 'perdido') { p.nextContact = ''; p.lostReason = reason || ''; }
  touch(p, 'status', `${STATUS[old]} para ${STATUS[status]}${reason ? ': ' + reason : ''}`);
  save(); render();
  if (status === 'fechado') toast('Fechado! Parabéns.', { type: 'ok' });
}
function deleteProspect(id) {

function dialog({ title, body, ok = 'Salvar', danger, onOk, onCancel, small = true }) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<form class="modal ${small ? 'sm' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}<div class="mact"><button type="button" class="btn gh" data-x>Cancelar</button><button type="submit" class="btn ${danger ? 'dg' : 'pri'}">${esc(ok)}</button></div></form>`;
  const close = (cancel) => { ov.remove(); if (cancel && onCancel) onCancel(); };
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) close(true); });
  $('[data-x]', ov).onclick = () => close(true);
  $('form', ov).addEventListener('submit', (e) => { e.preventDefault(); const r = onOk && onOk(ov); if (r !== false) close(false); });
  ov._close = close;
  document.body.append(ov);
  const f = $('input,select,textarea', ov); if (f) f.focus(); else $('button[type=submit]', ov).focus();
  return ov;
}

  if (tp) tp.onchange = () => { const m = (S.tpl || []).find((x) => x.id === tp.value); $('a[data-wa]', ov).href = waLink(p.contact, m ? fillTpl(m.text, p) : ''); };
  const pb = $('[data-proposal]', ov);
  if (pb) pb.onclick = () => { ov._close(false); proposal(p); };
  const cb = $('[data-contacted]', ov);
  if (cb) cb.onclick = () => { ov._close(false); contacted(p.id); };
}

function contacted(id) {
  const p = S.prospects.find((x) => x.id === id); if (!p) return;
  if (locked(p)) { toast('Outra pessoa já está atendendo este prospecto.', { type: 'err' }); return; }
  dialog({ title: 'Registrar contato', body: `<div class="f"><label for="cNote">O que foi combinado? (opcional)</label><input id="cNote" placeholder="Ex: enviou orçamento"></div><div class="f"><label for="cNext">Próximo contato</label><input id="cNext" type="date" value="${addDays(3)}"></div><div class="quick"><button type="button" class="btn sm gh" data-d="1">Amanhã</button><button type="button" class="btn sm gh" data-d="3">+3 dias</button><button type="button" class="btn sm gh" data-d="7">+7 dias</button></div>`, ok: 'Registrar', onOk: (d) => {
    take(p);
    p.nextContact = $('#cNext', d).value; if (p.status === 'prospectando') p.status = 'negociando';
    touch(p, 'contact', 'Contato feito' + ($('#cNote', d).value.trim() ? ': ' + $('#cNote', d).value.trim() : ''));
    save(); render(); toast('Contato registrado.', { type: 'ok' });
  } }).addEventListener('click', (e) => { const b = e.target.closest('[data-d]'); if (b) $('#cNext').value = addDays(+b.dataset.d); });
}

function editGoal() {
  const mk = mkey(new Date());
  dialog({ title: 'Meta do mês', body: `<div class="f"><label for="gv">Meta de faturamento de ${new Date().toLocaleDateString('pt-BR', { month: 'long' })} (R$)</label><input id="gv" type="number" min="0" step="50" inputmode="decimal" value="${S.goals[mk] ?? S.goal ?? ''}"></div>`, ok: 'Salvar meta', onOk: (d) => {
    const v = parseFloat($('#gv', d).value); if (isNaN(v) || v < 0) { toast('Digite um valor válido.', { type: 'err' }); return false; }
    S.goals[mk] = v; S.goal = v; save(); render();
  } });
}

function exportCsv() {
  const head = ['Cliente', 'Contato', 'Serviço', 'Valor', 'Recorrente', 'Status', 'Cadastro', 'Fechado em', 'Próximo contato', 'Responsável', 'Motivo da perda', 'Notas'];
  const rows = filtered().map((p) => [p.name, p.contact || '', p.service || '', p.value == null ? '' : p.value, p.recurring ? 'Sim' : 'Não', STATUS[p.status], fdate(p.date), p.closedAt ? fdate(p.closedAt) : '', p.nextContact ? fdate(p.nextContact) : '', who(p.responsavel), p.lostReason || '', (p.notes || '').replace(/\n/g, ' ')]);
  download(`prospectos_${today()}.csv`, '﻿' + [head, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n'), 'text/csv;charset=utf-8;');
}
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type })), a = document.createElement('a');
  a.href = url; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(url), 500);
}
function restore() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (!Array.isArray(d.prospects)) throw new Error('arquivo inválido');
      dialog({ title: 'Restaurar backup', body: `<p style="color:var(--dim)">Mesclar <b style="color:var(--text)">${d.prospects.length}</b> prospecto(s) do arquivo com os atuais? Registros com o mesmo ID serão substituídos pela versão mais recente.</p>`, ok: 'Restaurar', onOk: () => {
        const by = new Map(S.prospects.map((p) => [p.id, p]));
        d.prospects.forEach((p) => { if (p && p.id) { const o = by.get(p.id); if (!o || (p.updatedAt || 0) >= (o.updatedAt || 0)) by.set(p.id, { ...p, updatedAt: Date.now() }); } });
        S.prospects = [...by.values()]; if (d.goals) Object.assign(S.goals, d.goals); save(); render(); toast('Backup restaurado.', { type: 'ok' });
      } });
    } catch (e) { toast('Não consegui ler o arquivo: ' + e.message, { type: 'err' }); }
  };
  inp.click();
}

/* ---------- eventos ---------- */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (e.target.closest('a[href]') && t.dataset.act !== 'view') return;
  const a = t.dataset.act, id = t.dataset.id;
  if (t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
  if ((a === 'edit') && e.target.closest('select,button.ib,a,.acts') && !t.classList.contains('ib')) { if (e.target.closest('.acts')) return; }
  switch (a) {
    case 'view': setView(t.dataset.v); break;
    case 'new': openProspect(); break;
    case 'edit': openProspect(id); break;
    case 'del': deleteProspect(id); break;
    case 'contacted': contacted(id); break;
    case 'goal': editGoal(); break;
    case 'export': exportCsv(); break;
    case 'backup': download(`backup_painel_${today()}.json`, JSON.stringify({ prospects: S.prospects, goals: S.goals, goal: S.goal, at: new Date().toISOString() }, null, 1), 'application/json'); break;
    case 'restore': restore(); break;
    case 'emp-new': empDialog(null); break;
    case 'emp-edit': empDialog((S.team || []).find((x) => x.id === id)); break;
    case 'emp-toggle': { const e = (S.team || []).find((x) => x.id === id); if (!e) break;
      if (!e.active) { saveEmp({ id, active: true }, 'Funcionário reativado.'); break; }
      dialog({ title: 'Desativar funcionário', body: `<p style="color:var(--dim)"><b style="color:var(--text)">${esc(e.name)}</b> deixa de conseguir entrar, e os leads em aberto dele ficam livres para os outros.</p>`, ok: 'Desativar', danger: true, onOk: () => { saveEmp({ id, active: false }, 'Funcionário desativado.'); } }); break; }
    case 'pay': payDialog(id); break;
    case 'receipt': receipt(id); break;
    case 'unpay': { const p = S.prospects.find((x) => x.id === id); if (p) { p.commissionPaid = false; p.paidAt = ''; p.paidNote = ''; touch(p, 'paid', 'Pagamento desmarcado'); save(); render(); } break; }
    case 'report': reportDialog(); break;
    case 'tpl-new': tplDialog(null); break;
    case 'tpl-edit': tplDialog(S.tpl.find((x) => x.id === id)); break;
    case 'tpl-del': saveTpl(S.tpl.filter((x) => x.id !== id), 'Modelo excluído.'); break;
    case 'tpl-copy': { const m = S.tpl.find((x) => x.id === id); if (m) navigator.clipboard.writeText(fillTpl(m.text, null)).then(() => toast('Texto copiado.', { type: 'ok' }), () => toast('Não consegui copiar.', { type: 'err' })); break; }
    case 'bak-new': api('POST', {}, '?action=backups').then(() => { toast('Backup feito.', { type: 'ok' }); loadTeam(); }).catch((e) => toast(e.message, { type: 'err' })); break;
    case 'bak-dl': api('GET', null, '?action=backups&id=' + encodeURIComponent(id)).then((d) => download(`backup_painel_${ymd(new Date(d.at))}.json`, JSON.stringify(d, null, 1), 'application/json')).catch((e) => toast(e.message, { type: 'err' })); break;
    case 'bak-restore': dialog({ title: 'Restaurar backup', body: '<p style="color:var(--dim)">Os leads voltam ao estado desse backup. Antes disso, o painel guarda um backup do estado atual.</p>', ok: 'Restaurar', danger: true, onOk: () => { api('POST', { restore: id }, '?action=backups').then(async () => { toast('Backup restaurado.', { type: 'ok' }); await load(true); loadTeam(); }).catch((e) => toast(e.message, { type: 'err' })); } }); break;
    case 'logout': logout(); break;
    case 'filter': S.filter = t.dataset.k; saveUI(); render(); break;
    case 'resp': S.resp = t.dataset.k; saveUI(); render(); break;
    case 'sort': { const k = t.dataset.k; if (S.sort === k) S.dir = S.dir === 'asc' ? 'desc' : 'asc'; else { S.sort = k; S.dir = k === 'name' ? 'asc' : 'desc'; } render(); break; }
  }
});
document.addEventListener('click', (e) => {
  const w = e.target.closest('a[data-wa]'); if (!w) return;
  const p = S.prospects.find((x) => x.id === w.dataset.wa); if (!p) return;
  if (locked(p)) { e.preventDefault(); toast('Outra pessoa já está atendendo este prospecto.', { type: 'err' }); return; }
  if (isIntern() && !claim(p)) { take(p); save(); render(); }
}, true);
document.addEventListener('change', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'status') setStatus(t.dataset.id, t.value);
});
let qT;
document.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; clearTimeout(qT); qT = setTimeout(render, 120); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token && !saving && !S.deleted.length && !document.querySelector('.ov')) load(true); });
setInterval(() => { if (S.token && !document.hidden && !saving && !document.querySelector('.ov')) load(true); }, 90000);

boot();
</script>
</body>
</html>

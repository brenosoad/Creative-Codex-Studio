<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Creative Codex</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo.png?v=2" type="image/png">
    <style>
        .error-page {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 100px 20px 60px;
            background: linear-gradient(135deg, var(--dark) 0%, var(--secondary) 100%);
            color: var(--white-fixed);
            overflow: hidden;
        }
        .error-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(96, 165, 250, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(96, 165, 250, 0.07) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 40%, transparent 90%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 40%, transparent 90%);
            z-index: 1;
        }
        .error-page::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.3), transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.2), transparent 45%);
            z-index: 1;
        }
        .error-content {
            position: relative;
            z-index: 2;
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }
        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(90deg, var(--accent-light), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .error-title {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 3vw, 2rem);
            color: var(--white-fixed);
            margin: 16px 0 12px;
        }
        .error-text {
            color: #cbd5e1;
            max-width: 420px;
            margin: 0 auto 32px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-actions .btn-outline {
            color: var(--white-fixed);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .error-actions .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--white-fixed);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="hero-stars"></div>
        <div class="hero-aurora">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="hero-shooting-stars" aria-hidden="true">
            <span></span>
            <span></span>
        </div>
        
        <div class="error-content">
            <div class="error-badge">
                <i class="fas fa-satellite" aria-hidden="true"></i>
                <span>Off orbit</span>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">This page is offline</h1>
            <p class="error-text">The link you followed might be broken, or the page may have moved. Let's get you back on track.</p>
            <div class="error-actions">
                <a href="index-en.html" class="btn btn-primary">
                    <i class="fas fa-home" aria-hidden="true"></i>
                    Back to home
                </a>
                <a href="index-en.html#contact" class="btn btn-outline">
                    <i class="fab fa-whatsapp" aria-hidden="true"></i>
                    Talk to me
                </a>
            </div>
        </div>
        
        <svg class="hero-wave" viewBox="0 0 1440 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,40 C360,100 1080,0 1440,50 L1440,100 L0,100 Z"></path>
        </svg>
    </div>
</body>
</html>
